<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Iceberg Clicker — TG Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Цветовая палитра: Холодные тона, лед, глубина океана */
            --bg-deep: #0a1128;
            --bg-mid: #1c2541;
            --ice-light: #e0f7fa;
            --ice-mid: #80deea;
            --ice-dark: #26c6da;
            --ice-glow: rgba(128, 222, 234, 0.6);
            --accent-green: #00e676;
            --accent-blue: #40c4ff;
            --text-main: #ffffff;
            --text-secondary: #90a4ae;
            --panel-bg: rgba(28, 37, 65, 0.85);
            
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            /* Фон: градиент от глубокого океана к ночному небу */
            background: radial-gradient(circle at 50% 30%, var(--bg-mid) 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: 600;
            z-index: 10;
        }

        .header-title {
            flex: 1;
            text-align: center;
            text-shadow: 0 0 10px var(--ice-glow);
        }

        .close-btn, .menu-btn {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 22px;
        }

        /* --- Score Section --- */
        .score-section {
            text-align: center;
            padding: 5px 0;
            z-index: 10;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .balance {
            font-size: 46px;
            font-weight: 800;
            margin: 5px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: var(--ice-light);
            text-shadow: 0 0 20px var(--ice-glow), 0 0 40px rgba(64, 196, 255, 0.4);
        }

        .ice-icon {
            font-size: 32px;
            filter: drop-shadow(0 0 10px var(--ice-glow));
        }

        .income-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 15px;
            font-weight: 700;
        }

        .income-per-sec { color: var(--accent-green); text-shadow: 0 0 10px rgba(0, 230, 118, 0.5); }
        .income-per-click { color: var(--accent-blue); text-shadow: 0 0 10px rgba(64, 196, 255, 0.5); }

        /* --- Main Game Area --- */
        .game-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }

        /* Контейнер айсберга */
        .iceberg-container {
            position: relative;
            width: 220px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: transform 0.1s;
        }

        /* Сам айсберг (3D эффект через многослойность) */
        .iceberg {
            position: relative;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6));
            animation: float 4s ease-in-out infinite;
        }

        /* Верхняя часть айсберга (над водой) */
        .iceberg-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 200px;
            /* Форма айсберга через clip-path */
            clip-path: polygon(20% 100%, 0% 40%, 15% 10%, 40% 0%, 70% 5%, 90% 25%, 100% 60%, 85% 100%);
            background: linear-gradient(135deg, var(--ice-light) 0%, var(--ice-mid) 40%, var(--ice-dark) 100%);
            z-index: 2;
            /* Внутренние грани для объема */
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), inset 10px 10px 20px rgba(255,255,255,0.8);
        }

        /* Блик на айсберге */
        .iceberg-top::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 30%;
            height: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.9), transparent);
            clip-path: polygon(0 0, 100% 20%, 50% 100%);
            opacity: 0.8;
        }

        /* Подводная часть айсберга */
        .iceberg-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 140px;
            clip-path: polygon(10% 0%, 90% 0%, 100% 40%, 80% 100%, 20% 100%, 0% 40%);
            background: linear-gradient(180deg, var(--ice-dark) 0%, #00838f 60%, #004d40 100%);
            opacity: 0.7;
            z-index: 1;
            filter: blur(1px);
        }

        /* Вода (визуальный эффект) */
        .water-line {
            position: absolute;
            bottom: 140px;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(64, 196, 255, 0.5);
            box-shadow: 0 0 20px var(--accent-blue);
            z-index: 3;
        }

        /* Анимация покачивания */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        /* Анимация удара (тряска) */
        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Частицы льда */
        .ice-particle {
            position: absolute;
            background: var(--ice-light);
            border-radius: 2px;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 10px var(--ice-glow);
        }

        /* Всплывающий текст */
        .float-text {
            position: absolute;
            color: var(--ice-light);
            font-weight: 800;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 15px var(--ice-glow);
            font-size: 22px;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        /* --- Bottom Panel --- */
        .bottom-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 15px;
            padding-bottom: 10px;
            z-index: 20;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.5);
            border-top: 1px solid rgba(128, 222, 234, 0.2);
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
        }

        .tab.active {
            color: var(--accent-blue);
            position: relative;
            text-shadow: 0 0 10px var(--accent-blue);
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-blue);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(128, 222, 234, 0.2);
            border-radius: 14px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
            cursor: pointer;
            transition: transform 0.1s, background 0.1s;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.92);
            background: rgba(128, 222, 234, 0.2);
        }

        .card-icon {
            font-size: 22px;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 5px var(--ice-glow));
        }

        .card-label {
            font-size: 9px;
            text-align: center;
            color: #fff;
            line-height: 1.1;
            font-weight: 600;
        }

        .card.orange { background: linear-gradient(135deg, rgba(209, 125, 42, 0.4), rgba(168, 93, 30, 0.6)); }
        .card.green { background: linear-gradient(135deg, rgba(42, 138, 93, 0.4), rgba(30, 92, 65, 0.6)); }
        .card.purple { background: linear-gradient(135deg, rgba(138, 42, 138, 0.4), rgba(92, 30, 92, 0.6)); }
        .card.blue { background: linear-gradient(135deg, rgba(42, 106, 209, 0.4), rgba(30, 76, 138, 0.6)); }

        .gift-btn {
            background: linear-gradient(135deg, var(--accent-green), #00b248);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .gift-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            margin-top: 5px;
            border-top: 1px solid rgba(128, 222, 234, 0.1);
            padding-top: 8px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: var(--text-secondary);
            gap: 2px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue);
        }

        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <div class="close-btn" onclick="tg.close()">✕</div>
        <div class="header-title">Iceberg Clicker</div>
        <div class="menu-btn">⋮</div>
    </header>

    <div class="score-section">
        <div class="subtitle">ВАШ ЛЁД</div>
        <div class="balance">
            <span id="balance">0</span>
            <span class="ice-icon">🧊</span>
        </div>
        <div class="income-info">
            <span id="income-per-sec">+ 0/сек</span>
            <span id="income-per-click" class="income-per-click">+ 0/удар</span>
        </div>
    </div>

    <div class="game-area" id="game-area">
        <div class="iceberg-container" id="iceberg-container">
            <div class="iceberg" id="iceberg">
                <div class="iceberg-top"></div>
                <div class="iceberg-bottom"></div>
            </div>
            <div class="water-line"></div>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="tabs">
            <div class="tab active">Меню</div>
            <div class="tab">Улучшения</div>
            <div class="tab">Бонусы</div>
            <div class="tab">Инвентарь</div>
        </div>

        <div class="gift-btn" onclick="tg.HapticFeedback.impactOccurred('light')">🎁</div>
        <div class="subtitle" style="text-align:left; margin-bottom: 5px; font-size: 11px;">Ещё льда?</div>

        <div class="cards-grid">
            <div class="card orange" onclick="buyUpgrade(1)">
                <div class="card-icon">⭐</div>
                <div class="card-label">Рейтинг</div>
            </div>
            <div class="card green" onclick="buyUpgrade(2)">
                <div class="card-icon">💸</div>
                <div class="card-label">Перевести</div>
            </div>
            <div class="card purple" onclick="buyUpgrade(3)">
                <div class="card-icon">🕒</div>
                <div class="card-label">История</div>
            </div>
            <div class="card blue" onclick="buyUpgrade(4)">
                <div class="card-icon">🛍️</div>
                <div class="card-label">Магазин</div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active">
                <span class="nav-icon">🧊</span>
                <span>Лёд</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Рейтинг</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚔️</span>
                <span>Боссы</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">🛡️</span>
                <span>Персонаж</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </div>
        </div>
    </div>

    <script>
        // --- Инициализация Telegram Web App ---
        let tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0a1128');
            tg.setBackgroundColor('#0a1128');
        } else {
            tg = {
                close: () => alert("Это приложение для Telegram!"),
                HapticFeedback: {
                    impactOccurred: () => {},
                    notificationOccurred: () => {}
                },
                showAlert: (msg) => alert(msg)
            };
        }

        // --- Игровое состояние ---
        let balance = 0;
        let incomePerSecond = 0;
        let incomePerClick = 1; // Начинаем с 1 льда за удар
        let upgradeLevel = 1;
        let upgradeCost = 50;

        // --- DOM Элементы ---
        const balanceEl = document.getElementById('balance');
        const incomeSecEl = document.getElementById('income-per-sec');
        const incomeClickEl = document.getElementById('income-per-click');
        const gameArea = document.getElementById('game-area');
        const iceberg = document.getElementById('iceberg');

        // --- Форматирование чисел ---
        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' млрд';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' млн';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + ' тыс.';
            return Math.floor(num).toString();
        }

        function updateUI() {
            balanceEl.textContent = formatNumber(balance);
            incomeSecEl.textContent = `+ ${formatNumber(incomePerSecond)}/сек`;
            incomeClickEl.textContent = `+ ${formatNumber(incomePerClick)}/удар`;
        }

        // --- Пассивный доход ---
        setInterval(() => {
            if (incomePerSecond > 0) {
                balance += incomePerSecond;
                updateUI();
            }
        }, 1000);

        // --- Клик по айсбергу ---
        gameArea.addEventListener('click', (e) => {
            // Получаем координаты клика относительно игрового поля
            const rect = gameArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 1. Начисляем валюту
            balance += incomePerClick;
            updateUI();

            // 2. Визуальные эффекты
            createFloatingText(incomePerClick, x, y);
            createIceParticles(x, y);
            shakeIceberg();
            
            // 3. Вибрация
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // --- Тряска айсберга ---
        function shakeIceberg() {
            iceberg.classList.remove('shake');
            // Небольшая хитрость, чтобы анимация перезапустилась
            void iceberg.offsetWidth; 
            iceberg.classList.add('shake');
        }

        // --- Всплывающий текст ---
        function createFloatingText(amount, x, y) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.textContent = '+' + formatNumber(amount);
            el.style.left = (x - 20) + 'px';
            el.style.top = (y - 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // --- Частицы льда (осколки) ---
        function createIceParticles(x, y) {
            const particleCount = 6; // Количество осколков за удар
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'ice-particle';
                
                // Случайный размер осколка
                const size = Math.random() * 8 + 4;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Позиция начала (место клика)
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                // Случайное направление разлета
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 50;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                // Анимация через Web Animations API
                particle.animate([
                    { transform: 'translate(0, 0) scale(1) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: 600 + Math.random() * 400,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });
                
                document.body.appendChild(particle);
                
                // Удаляем частицу после завершения анимации
                setTimeout(() => particle.remove(), 1000);
            }
        }

        // --- Улучшения ---
        function buyUpgrade(type) {
            if (balance >= upgradeCost) {
                balance -= upgradeCost;
                upgradeLevel++;
                upgradeCost = Math.floor(upgradeCost * 1.6);
                
                if (type === 1) incomePerClick += 2;
                if (type === 2) incomePerSecond += 5;
                if (type === 3) incomePerClick += 10;
                if (type === 4) incomePerSecond += 25;
                
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert("Улучшение куплено! Теперь вы добываете больше льда.");
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("Недостаточно льда! Нужно " + formatNumber(upgradeCost));
            }
        }

        // --- Старт ---
        updateUI();
    </script>
</body>
</html>
