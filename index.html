<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Iceberg Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-mid: #0f1a3a;
            --ice-light: #ffffff;
            --ice-mid: #a0e9ff;
            --ice-dark: #4dd0e1;
            --ice-deep: #00838f;
            --ice-glow: rgba(128, 222, 234, 0.8);
            --accent-green: #00e676;
            --accent-blue: #40c4ff;
            --text-main: #ffffff;
            --text-secondary: #90a4ae;
            --panel-bg: rgba(15, 26, 58, 0.85);
            
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at 50% 20%, #1a3a5c 0%, var(--bg-mid) 40%, var(--bg-deep) 100%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* --- Score Section --- */
        .score-section {
            text-align: center;
            padding: 20px 0 5px 0;
            z-index: 10;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .balance {
            font-size: 48px;
            font-weight: 900;
            margin: 5px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: var(--ice-light);
            text-shadow: 0 0 20px var(--ice-glow), 0 0 40px rgba(64, 196, 255, 0.6);
            font-variant-numeric: tabular-nums;
        }

        .ice-icon {
            font-size: 34px;
            filter: drop-shadow(0 0 15px var(--ice-glow));
        }

        .income-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 15px;
            font-weight: 700;
        }

        .income-per-sec { color: var(--accent-green); text-shadow: 0 0 10px rgba(0, 230, 118, 0.6); }
        .income-per-click { color: var(--accent-blue); text-shadow: 0 0 10px rgba(64, 196, 255, 0.6); }

        /* --- Main Game Area --- */
        .game-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            perspective: 1000px;
        }

        /* Контейнер айсберга */
        .iceberg-container {
            position: relative;
            width: 280px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: transform 0.1s;
        }

        /* SVG Айсберг */
        .iceberg-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.7));
            animation: float 5s ease-in-out infinite;
            will-change: transform;
        }

        /* Анимация покачивания на воде */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-0.5deg); }
            50% { transform: translateY(-12px) rotate(0.5deg); }
        }

        /* Анимация удара */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(5px, 0, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(8px, 0, 0) rotate(2deg); }
        }

        /* Свечение вокруг айсберга */
        .iceberg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(128, 222, 234, 0.3) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* --- Частицы льда --- */
        .ice-particle {
            position: absolute;
            background: linear-gradient(135deg, #ffffff, #a0e9ff);
            border-radius: 2px;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 12px var(--ice-glow), 0 0 4px #fff;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        /* --- Всплывающий текст --- */
        .float-text {
            position: absolute;
            color: #ffffff;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 15px var(--ice-glow), 0 0 30px var(--accent-blue);
            font-size: 24px;
            font-variant-numeric: tabular-nums;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.6); }
        }

        /* --- Bottom Panel --- */
        .bottom-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 15px;
            padding-bottom: 10px;
            z-index: 20;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            border-top: 1px solid rgba(128, 222, 234, 0.2);
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
        }

        .tab.active {
            color: var(--accent-blue);
            position: relative;
            text-shadow: 0 0 10px var(--accent-blue);
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-blue);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(128, 222, 234, 0.2);
            border-radius: 14px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
            cursor: pointer;
            transition: transform 0.1s, background 0.1s;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.92);
            background: rgba(128, 222, 234, 0.25);
        }

        .card-icon {
            font-size: 22px;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 5px var(--ice-glow));
        }

        .card-label {
            font-size: 9px;
            text-align: center;
            color: #fff;
            line-height: 1.1;
            font-weight: 600;
        }

        .card.orange { background: linear-gradient(135deg, rgba(209, 125, 42, 0.4), rgba(168, 93, 30, 0.6)); }
        .card.green { background: linear-gradient(135deg, rgba(42, 138, 93, 0.4), rgba(30, 92, 65, 0.6)); }
        .card.purple { background: linear-gradient(135deg, rgba(138, 42, 138, 0.4), rgba(92, 30, 92, 0.6)); }
        .card.blue { background: linear-gradient(135deg, rgba(42, 106, 209, 0.4), rgba(30, 76, 138, 0.6)); }

        .gift-btn {
            background: linear-gradient(135deg, var(--accent-green), #00b248);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .gift-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            margin-top: 5px;
            border-top: 1px solid rgba(128, 222, 234, 0.1);
            padding-top: 8px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: var(--text-secondary);
            gap: 2px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue);
        }

        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="score-section">
        <div class="subtitle">ВАШ ЛЁД</div>
        <div class="balance">
            <span id="balance">0</span>
            <span class="ice-icon">🧊</span>
        </div>
        <div class="income-info">
            <span id="income-per-sec">+ 0/сек</span>
            <span id="income-per-click" class="income-per-click">+ 0/удар</span>
        </div>
    </div>

    <div class="game-area" id="game-area">
        <div class="iceberg-container" id="iceberg-container">
            <div class="iceberg-glow"></div>
            
            <!-- КРАСИВЫЙ SVG АЙСБЕРГ -->
            <svg class="iceberg-svg" id="iceberg" viewBox="0 0 280 380" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="iceTopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                        <stop offset="25%" stop-color="#e0f7fa" stop-opacity="1"/>
                        <stop offset="60%" stop-color="#80deea" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#26c6da" stop-opacity="1"/>
                    </linearGradient>
                    
                    <linearGradient id="iceBottomGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#4dd0e1" stop-opacity="0.9"/>
                        <stop offset="50%" stop-color="#00838f" stop-opacity="0.7"/>
                        <stop offset="100%" stop-color="#004d40" stop-opacity="0.3"/>
                    </linearGradient>
                    
                    <radialGradient id="iceHighlight" cx="35%" cy="25%" r="50%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>
                    
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                
                <path d="M 60 220 
                         C 40 260, 30 320, 70 360 
                         C 110 380, 170 380, 210 360 
                         C 250 320, 240 260, 220 220 
                         Z" 
                      fill="url(#iceBottomGradient)" 
                      filter="url(#glow)"
                      opacity="0.7"/>
                
                <path d="M 70 220 
                         L 60 180 
                         C 55 150, 70 100, 90 70 
                         C 105 45, 130 25, 150 20 
                         C 170 18, 190 30, 205 55 
                         C 220 80, 225 120, 215 160 
                         L 210 220 
                         C 200 225, 80 225, 70 220
                         Z" 
                      fill="url(#iceTopGradient)"/>
                
                <path d="M 70 220 
                         L 60 180 
                         C 55 150, 70 100, 90 70 
                         C 100 60, 110 50, 120 45
                         L 130 80
                         C 110 120, 105 170, 110 220
                         Z" 
                      fill="#b2ebf2" 
                      opacity="0.6"/>
                
                <path d="M 210 220 
                         L 215 160 
                         C 225 120, 220 80, 205 55 
                         C 200 45, 190 38, 180 35
                         L 175 70
                         C 190 100, 195 160, 190 220
                         Z" 
                      fill="#4dd0e1" 
                      opacity="0.5"/>
                
                <path d="M 90 70 
                         C 105 45, 130 25, 150 20 
                         C 155 30, 155 60, 145 90
                         C 130 85, 110 80, 90 70
                         Z" 
                      fill="url(#iceHighlight)"/>
                
                <path d="M 130 60 L 125 120 L 135 140 L 128 200" 
                      stroke="#4dd0e1" 
                      stroke-width="1.5" 
                      fill="none" 
                      opacity="0.6"/>
                
                <path d="M 170 50 L 175 100 L 165 130" 
                      stroke="#26c6da" 
                      stroke-width="1" 
                      fill="none" 
                      opacity="0.5"/>
                
                <path d="M 100 150 L 115 170 L 105 200" 
                      stroke="#80deea" 
                      stroke-width="1" 
                      fill="none" 
                      opacity="0.4"/>
                
                <path d="M 110 100 
                         C 120 90, 140 85, 160 90 
                         C 165 110, 165 130, 160 150
                         C 140 145, 120 145, 110 150
                         C 105 130, 105 110, 110 100
                         Z" 
                      fill="#ffffff" 
                      opacity="0.15"/>
                
                <line x1="0" y1="220" x2="280" y2="220" 
                      stroke="#40c4ff" 
                      stroke-width="2" 
                      opacity="0.8"
                      filter="url(#glow)"/>
                
                <ellipse cx="140" cy="230" rx="80" ry="8" 
                         fill="#40c4ff" 
                         opacity="0.3" 
                         filter="url(#glow)"/>
            </svg>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="tabs">
            <div class="tab active">Меню</div>
            <div class="tab">Улучшения</div>
            <div class="tab">Бонусы</div>
            <div class="tab">Инвентарь</div>
        </div>

        <div class="gift-btn" onclick="tg.HapticFeedback.impactOccurred('light')">🎁</div>
        <div class="subtitle" style="text-align:left; margin-bottom: 5px; font-size: 11px;">Ещё льда?</div>

        <div class="cards-grid">
            <div class="card orange" onclick="buyUpgrade(1)">
                <div class="card-icon">⭐</div>
                <div class="card-label">Рейтинг</div>
            </div>
            <div class="card green" onclick="buyUpgrade(2)">
                <div class="card-icon">💸</div>
                <div class="card-label">Перевести</div>
            </div>
            <div class="card purple" onclick="buyUpgrade(3)">
                <div class="card-icon">🕒</div>
                <div class="card-label">История</div>
            </div>
            <div class="card blue" onclick="buyUpgrade(4)">
                <div class="card-icon">🛍️</div>
                <div class="card-label">Магазин</div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active">
                <span class="nav-icon">🧊</span>
                <span>Лёд</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Рейтинг</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚔️</span>
                <span>Боссы</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">🛡️</span>
                <span>Персонаж</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#050a1a');
            tg.setBackgroundColor('#050a1a');
        } else {
            tg = {
                close: () => alert("Это приложение для Telegram!"),
                HapticFeedback: {
                    impactOccurred: () => {},
                    notificationOccurred: () => {}
                },
                showAlert: (msg) => alert(msg)
            };
        }

        let balance = 0;
        let incomePerSecond = 0;
        let incomePerClick = 1;
        let upgradeLevel = 1;
        let upgradeCost = 50;

        const balanceEl = document.getElementById('balance');
        const incomeSecEl = document.getElementById('income-per-sec');
        const incomeClickEl = document.getElementById('income-per-click');
        const gameArea = document.getElementById('game-area');
        const iceberg = document.getElementById('iceberg');

        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' млрд';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' млн';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + ' тыс.';
            return Math.floor(num).toString();
        }

        function updateUI() {
            balanceEl.textContent = formatNumber(balance);
            incomeSecEl.textContent = `+ ${formatNumber(incomePerSecond)}/сек`;
            incomeClickEl.textContent = `+ ${formatNumber(incomePerClick)}/удар`;
        }

        setInterval(() => {
            if (incomePerSecond > 0) {
                balance += incomePerSecond;
                updateUI();
            }
        }, 1000);

        gameArea.addEventListener('click', (e) => {
            const rect = gameArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            balance += incomePerClick;
            updateUI();

            createFloatingText(incomePerClick, x, y);
            createIceParticles(x, y);
            shakeIceberg();
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        function shakeIceberg() {
            iceberg.classList.remove('shake');
            void iceberg.offsetWidth; 
            iceberg.classList.add('shake');
        }

        function createFloatingText(amount, x, y) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.textContent = '+' + formatNumber(amount);
            el.style.left = (x - 20) + 'px';
            el.style.top = (y - 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function createIceParticles(x, y) {
            const particleCount = 8;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'ice-particle';
                
                const size = Math.random() * 10 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 80;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.animate([
                    { transform: 'translate(0, 0) scale(1) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0.3) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: 700 + Math.random() * 500,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
                });
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1200);
            }
        }

        function buyUpgrade(type) {
            if (balance >= upgradeCost) {
                balance -= upgradeCost;
                upgradeLevel++;
                upgradeCost = Math.floor(upgradeCost * 1.6);
                
                if (type === 1) incomePerClick += 2;
                if (type === 2) incomePerSecond += 5;
                if (type === 3) incomePerClick += 10;
                if (type === 4) incomePerSecond += 25;
                
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert("Улучшение куплено!");
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("Недостаточно льда! Нужно " + formatNumber(upgradeCost));
            }
        }

        updateUI();
    </script>
</body>
</html>
