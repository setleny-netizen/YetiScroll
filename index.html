<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Iceberg Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-mid: #0f1a3a;
            --ice-light: #ffffff;
            --ice-mid: #a0e9ff;
            --ice-dark: #4dd0e1;
            --ice-glow: rgba(128, 222, 234, 0.8);
            --accent-green: #00e676;
            --accent-blue: #40c4ff;
            --text-main: #ffffff;
            --text-secondary: #90a4ae;
            --panel-bg: rgba(15, 26, 58, 0.92);
            
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at 50% 20%, #1a3a5c 0%, var(--bg-mid) 40%, var(--bg-deep) 100%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* --- Score Section --- */
        .score-section {
            text-align: center;
            padding: 15px 0 0 0;
            z-index: 10;
            flex-shrink: 0;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .balance {
            font-size: 44px;
            font-weight: 900;
            margin: 4px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: var(--ice-light);
            text-shadow: 0 0 20px var(--ice-glow), 0 0 40px rgba(64, 196, 255, 0.6);
            font-variant-numeric: tabular-nums;
            position: relative;
        }

        .ice-icon {
            font-size: 32px;
            filter: drop-shadow(0 0 15px var(--ice-glow));
        }

        .balance.pulse {
            animation: balancePulse 0.3s ease-out;
        }

        @keyframes balancePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .income-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 14px;
            font-weight: 700;
        }

        .income-per-sec { color: var(--accent-green); text-shadow: 0 0 10px rgba(0, 230, 118, 0.6); }
        .income-per-click { color: var(--accent-blue); text-shadow: 0 0 10px rgba(64, 196, 255, 0.6); }

        /* --- Main Game Area --- */
        .game-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            min-height: 0; /* Важно для flex-контейнера! */
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Контейнер айсберга — компактнее и с отступами */
        .iceberg-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px 40px 20px; /* Отступ снизу, чтобы не было обрезки */
            z-index: 2;
        }

        /* SVG Айсберг — теперь с сохранением пропорций */
        .iceberg-svg {
            width: 100%;
            height: 100%;
            max-width: 340px;
            max-height: 100%;
            overflow: visible;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6));
            animation: float 5s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-0.5deg); }
            50% { transform: translateY(-8px) rotate(0.5deg); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(5px, 0, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(8px, 0, 0) rotate(2deg); }
        }

        /* Свечение убрано или сильно уменьшено, чтобы не съедало края */
        .iceberg-glow {
            display: none;
        }

        /* --- Всплывающий текст --- */
        .float-text {
            position: absolute;
            color: #ffffff;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 0.9s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 15px var(--ice-glow), 0 0 30px var(--accent-blue);
            font-size: 22px;
            font-variant-numeric: tabular-nums;
            will-change: transform, opacity;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.4); }
        }

        /* --- Летящий кусок льда --- */
        .flying-ice {
            position: fixed;
            font-size: 22px;
            pointer-events: none;
            z-index: 200;
            filter: drop-shadow(0 0 10px var(--ice-glow));
            will-change: transform, opacity;
        }

        /* --- Bottom Panel --- */
        .bottom-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 15px;
            padding-bottom: 10px;
            z-index: 20;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            border-top: 1px solid rgba(128, 222, 234, 0.2);
            flex-shrink: 0;
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
        }

        .tab.active {
            color: var(--accent-blue);
            position: relative;
            text-shadow: 0 0 10px var(--accent-blue);
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-blue);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(128, 222, 234, 0.2);
            border-radius: 14px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
            cursor: pointer;
            transition: transform 0.1s, background 0.1s;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.92);
            background: rgba(128, 222, 234, 0.25);
        }

        .card-icon {
            font-size: 22px;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 5px var(--ice-glow));
        }

        .card-label {
            font-size: 9px;
            text-align: center;
            color: #fff;
            line-height: 1.1;
            font-weight: 600;
        }

        .card.orange { background: linear-gradient(135deg, rgba(209, 125, 42, 0.4), rgba(168, 93, 30, 0.6)); }
        .card.green { background: linear-gradient(135deg, rgba(42, 138, 93, 0.4), rgba(30, 92, 65, 0.6)); }
        .card.purple { background: linear-gradient(135deg, rgba(138, 42, 138, 0.4), rgba(92, 30, 92, 0.6)); }
        .card.blue { background: linear-gradient(135deg, rgba(42, 106, 209, 0.4), rgba(30, 76, 138, 0.6)); }

        .gift-btn {
            background: linear-gradient(135deg, var(--accent-green), #00b248);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .gift-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            margin-top: 5px;
            border-top: 1px solid rgba(128, 222, 234, 0.1);
            padding-top: 8px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: var(--text-secondary);
            gap: 2px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue);
        }

        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="score-section">
        <div class="subtitle">ВАШ ЛЁД</div>
        <div class="balance" id="balance-wrapper">
            <span id="balance">0</span>
            <span class="ice-icon">🧊</span>
        </div>
        <div class="income-info">
            <span id="income-per-sec">+ 0/сек</span>
            <span id="income-per-click" class="income-per-click">+ 0/удар</span>
        </div>
    </div>

    <div class="game-area" id="game-area">
        <canvas id="particles-canvas"></canvas>
        
        <div class="iceberg-container" id="iceberg-container">
            <!-- Айсберг перерисован: компактнее, с видимыми гранями и бликами -->
            <svg class="iceberg-svg" id="iceberg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Основной градиент льда -->
                    <linearGradient id="iceMain" x1="20%" y1="0%" x2="80%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="30%" stop-color="#e0f7fa"/>
                        <stop offset="65%" stop-color="#80deea"/>
                        <stop offset="100%" stop-color="#4dd0e1"/>
                    </linearGradient>
                    
                    <!-- Боковая грань (тень) -->
                    <linearGradient id="iceSide" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#26c6da"/>
                        <stop offset="100%" stop-color="#4dd0e1"/>
                    </linearGradient>
                    
                    <!-- Подводная часть -->
                    <linearGradient id="iceBottom" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#4dd0e1" stop-opacity="0.85"/>
                        <stop offset="60%" stop-color="#00838f" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#004d40" stop-opacity="0.2"/>
                    </linearGradient>
                    
                    <!-- Блик сверху -->
                    <radialGradient id="iceShine" cx="35%" cy="20%" r="45%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>
                </defs>
                
                <!-- ПОДВОДНАЯ ЧАСТЬ (видна, но полупрозрачна) -->
                <path d="M 85 250 
                         C 65 290, 60 340, 90 370 
                         C 120 390, 180 390, 210 370 
                         C 240 340, 235 290, 215 250 
                         Z" 
                      fill="url(#iceBottom)"/>
                
                <!-- ОСНОВНАЯ НАДВОДНАЯ ЧАСТЬ -->
                <path d="M 90 250 
                         L 85 210 
                         C 80 175, 95 125, 115 95 
                         C 130 72, 150 55, 165 52 
                         C 180 50, 195 60, 210 82 
                         C 225 105, 230 145, 225 185 
                         L 218 250 
                         Z" 
                      fill="url(#iceMain)"/>
                
                <!-- ЛЕВАЯ ГРАНЬ (тень для объема) -->
                <path d="M 90 250 
                         L 85 210 
                         C 80 175, 95 125, 115 95 
                         C 122 85, 130 78, 138 74
                         L 145 105
                         C 130 140, 125 190, 128 250
                         Z" 
                      fill="#80deea" 
                      opacity="0.7"/>
                
                <!-- ПРАВАЯ ГРАНЬ -->
                <path d="M 218 250 
                         L 225 185 
                         C 230 145, 225 105, 210 82 
                         C 205 73, 198 66, 190 62
                         L 185 95
                         C 195 125, 200 185, 195 250
                         Z" 
                      fill="#26c6da" 
                      opacity="0.6"/>
                
                <!-- БЛИК (свет сверху-слева) -->
                <path d="M 115 95 
                         C 130 72, 150 55, 165 52 
                         C 168 62, 165 90, 155 115
                         C 140 110, 125 105, 115 95
                         Z" 
                      fill="url(#iceShine)"/>
                
                <!-- ТРЕЩИНЫ / грани -->
                <path d="M 145 90 L 142 150 L 152 170 L 145 230" 
                      stroke="#4dd0e1" 
                      stroke-width="1.5" 
                      fill="none" 
                      opacity="0.5"/>
                
                <path d="M 180 85 L 185 130 L 175 160" 
                      stroke="#26c6da" 
                      stroke-width="1" 
                      fill="none" 
                      opacity="0.4"/>
                
                <path d="M 120 175 L 132 195 L 122 225" 
                      stroke="#80deea" 
                      stroke-width="1" 
                      fill="none" 
                      opacity="0.4"/>
                
                <!-- ЛИНИЯ ВОДЫ (видна чётко) -->
                <line x1="0" y1="250" x2="300" y2="250" 
                      stroke="#40c4ff" 
                      stroke-width="2" 
                      opacity="0.7"/>
                
                <!-- ОТРАЖЕНИЕ (маленькое, компактное) -->
                <ellipse cx="150" cy="258" rx="45" ry="4" 
                         fill="#40c4ff" 
                         opacity="0.25"/>
            </svg>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="tabs">
            <div class="tab active">Меню</div>
            <div class="tab">Улучшения</div>
            <div class="tab">Бонусы</div>
            <div class="tab">Инвентарь</div>
        </div>

        <div class="gift-btn" onclick="tg.HapticFeedback.impactOccurred('light')">🎁</div>
        <div class="subtitle" style="text-align:left; margin-bottom: 5px; font-size: 11px;">Ещё льда?</div>

        <div class="cards-grid">
            <div class="card orange" onclick="buyUpgrade(1)">
                <div class="card-icon">⭐</div>
                <div class="card-label">Рейтинг</div>
            </div>
            <div class="card green" onclick="buyUpgrade(2)">
                <div class="card-icon">💸</div>
                <div class="card-label">Перевести</div>
            </div>
            <div class="card purple" onclick="buyUpgrade(3)">
                <div class="card-icon">🕒</div>
                <div class="card-label">История</div>
            </div>
            <div class="card blue" onclick="buyUpgrade(4)">
                <div class="card-icon">🛍️</div>
                <div class="card-label">Магазин</div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active">
                <span class="nav-icon">🧊</span>
                <span>Лёд</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Рейтинг</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚔️</span>
                <span>Боссы</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">🛡️</span>
                <span>Персонаж</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#050a1a');
            tg.setBackgroundColor('#050a1a');
        } else {
            tg = {
                close: () => {},
                HapticFeedback: { impactOccurred: () => {}, notificationOccurred: () => {} },
                showAlert: (msg) => alert(msg)
            };
        }

        let balance = 0;
        let incomePerSecond = 0;
        let incomePerClick = 1;
        let upgradeLevel = 1;
        let upgradeCost = 50;

        const balanceEl = document.getElementById('balance');
        const balanceWrapper = document.getElementById('balance-wrapper');
        const incomeSecEl = document.getElementById('income-per-sec');
        const incomeClickEl = document.getElementById('income-per-click');
        const gameArea = document.getElementById('game-area');
        const iceberg = document.getElementById('iceberg');
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        // --- Canvas размер с DPR ---
        let canvasW = 0, canvasH = 0;
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = gameArea.getBoundingClientRect();
            canvasW = rect.width;
            canvasH = rect.height;
            canvas.width = canvasW * dpr;
            canvas.height = canvasH * dpr;
            canvas.style.width = canvasW + 'px';
            canvas.style.height = canvasH + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- Частицы ---
        const particles = [];
        const MAX_PARTICLES = 150;

        function spawnParticles(x, y, count) {
            for (let i = 0; i < count; i++) {
                if (particles.length >= MAX_PARTICLES) break;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2,
                    size: Math.random() * 5 + 3,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.3,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.015,
                    color: Math.random() > 0.5 ? '#ffffff' : '#a0e9ff'
                });
            }
        }

        let lastTime = 0;
        function animateParticles(time) {
            const dt = Math.min((time - lastTime) / 16.67, 2);
            lastTime = time;
            ctx.clearRect(0, 0, canvasW, canvasH);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.35 * dt;
                p.vx *= 0.98;
                p.rotation += p.rotSpeed * dt;
                p.life -= p.decay * dt;
                
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = '#80deea';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.moveTo(0, -p.size);
                ctx.lineTo(p.size * 0.7, 0);
                ctx.lineTo(0, p.size);
                ctx.lineTo(-p.size * 0.7, 0);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);

        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' млрд';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' млн';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + ' тыс.';
            return Math.floor(num).toString();
        }

        function updateUI() {
            balanceEl.textContent = formatNumber(balance);
            incomeSecEl.textContent = `+ ${formatNumber(incomePerSecond)}/сек`;
            incomeClickEl.textContent = `+ ${formatNumber(incomePerClick)}/удар`;
        }

        setInterval(() => {
            if (incomePerSecond > 0) {
                balance += incomePerSecond;
                updateUI();
            }
        }, 1000);

        gameArea.addEventListener('click', (e) => {
            const rect = gameArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            balance += incomePerClick;
            updateUI();

            spawnParticles(x, y, 8);
            createFloatingText(incomePerClick, x, y);
            createFlyingIce(e.clientX, e.clientY);
            shakeIceberg();
            pulseBalance();
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        function shakeIceberg() {
            iceberg.classList.remove('shake');
            void iceberg.offsetWidth; 
            iceberg.classList.add('shake');
        }

        function pulseBalance() {
            balanceWrapper.classList.remove('pulse');
            void balanceWrapper.offsetWidth;
            balanceWrapper.classList.add('pulse');
        }

        function createFloatingText(amount, x, y) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.textContent = '+' + formatNumber(amount);
            el.style.left = (x - 20) + 'px';
            el.style.top = (y - 20) + 'px';
            gameArea.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

        function createFlyingIce(startX, startY) {
            const ice = document.createElement('div');
            ice.className = 'flying-ice';
            ice.textContent = '🧊';
            ice.style.left = startX + 'px';
            ice.style.top = startY + 'px';
            document.body.appendChild(ice);
            
            const target = document.querySelector('.ice-icon');
            const targetRect = target.getBoundingClientRect();
            const targetX = targetRect.left + targetRect.width / 2;
            const targetY = targetRect.top + targetRect.height / 2;
            
            const startTime = performance.now();
            const duration = 600;
            const startXVal = startX;
            const startYVal = startY;
            const deltaX = targetX - startXVal;
            const deltaY = targetY - startYVal;
            const controlX = startXVal + deltaX * 0.5;
            const controlY = Math.min(startYVal, targetY) - 100;
            
            function animate(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const mt = 1 - t;
                const x = mt * mt * startXVal + 2 * mt * t * controlX + t * t * targetX;
                const y = mt * mt * startYVal + 2 * mt * t * controlY + t * t * targetY;
                const scale = 1 - t * 0.5;
                const opacity = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
                
                ice.style.transform = `translate(${x - startXVal}px, ${y - startYVal}px) scale(${scale})`;
                ice.style.opacity = opacity;
                
                if (t < 1) requestAnimationFrame(animate);
                else ice.remove();
            }
            requestAnimationFrame(animate);
        }

        function buyUpgrade(type) {
            if (balance >= upgradeCost) {
                balance -= upgradeCost;
                upgradeLevel++;
                upgradeCost = Math.floor(upgradeCost * 1.6);
                
                if (type === 1) incomePerClick += 2;
                if (type === 2) incomePerSecond += 5;
                if (type === 3) incomePerClick += 10;
                if (type === 4) incomePerSecond += 25;
                
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        updateUI();
    </script>
</body>
</html>
