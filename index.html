<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Iceberg Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-mid: #0f1a3a;
            --ice-light: #ffffff;
            --ice-mid: #a0e9ff;
            --ice-dark: #4dd0e1;
            --ice-glow: rgba(128, 222, 234, 0.8);
            --accent-green: #00e676;
            --accent-blue: #40c4ff;
            --text-main: #ffffff;
            --text-secondary: #90a4ae;
            --panel-bg: rgba(15, 26, 58, 0.85);
            
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at 50% 20%, #1a3a5c 0%, var(--bg-mid) 40%, var(--bg-deep) 100%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* --- Score Section --- */
        .score-section {
            text-align: center;
            padding: 20px 0 5px 0;
            z-index: 10;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .balance {
            font-size: 48px;
            font-weight: 900;
            margin: 5px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: var(--ice-light);
            text-shadow: 0 0 20px var(--ice-glow), 0 0 40px rgba(64, 196, 255, 0.6);
            font-variant-numeric: tabular-nums;
            position: relative;
        }

        .ice-icon {
            font-size: 34px;
            filter: drop-shadow(0 0 15px var(--ice-glow));
        }

        /* Пульсация баланса при получении льда */
        .balance.pulse {
            animation: balancePulse 0.3s ease-out;
        }

        @keyframes balancePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .income-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 15px;
            font-weight: 700;
        }

        .income-per-sec { color: var(--accent-green); text-shadow: 0 0 10px rgba(0, 230, 118, 0.6); }
        .income-per-click { color: var(--accent-blue); text-shadow: 0 0 10px rgba(64, 196, 255, 0.6); }

        /* --- Main Game Area --- */
        .game-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }

        /* Canvas для частиц — лежит ПОД айсбергом, но над фоном */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Контейнер айсберга */
        .iceberg-container {
            position: relative;
            width: 320px;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* SVG Айсберг */
        .iceberg-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.7));
            animation: float 5s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-0.5deg); }
            50% { transform: translateY(-12px) rotate(0.5deg); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(5px, 0, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(8px, 0, 0) rotate(2deg); }
        }

        .iceberg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(128, 222, 234, 0.3) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* --- Всплывающий текст (остается DOM — его мало) --- */
        .float-text {
            position: absolute;
            color: #ffffff;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 0.9s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 15px var(--ice-glow), 0 0 30px var(--accent-blue);
            font-size: 22px;
            font-variant-numeric: tabular-nums;
            will-change: transform, opacity;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.4); }
        }

        /* --- Летящий кусок льда к балансу --- */
        .flying-ice {
            position: fixed;
            font-size: 22px;
            pointer-events: none;
            z-index: 200;
            filter: drop-shadow(0 0 10px var(--ice-glow));
            will-change: transform, opacity;
        }

        /* --- Bottom Panel --- */
        .bottom-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 15px;
            padding-bottom: 10px;
            z-index: 20;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            border-top: 1px solid rgba(128, 222, 234, 0.2);
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
        }

        .tab.active {
            color: var(--accent-blue);
            position: relative;
            text-shadow: 0 0 10px var(--accent-blue);
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-blue);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(128, 222, 234, 0.2);
            border-radius: 14px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
            cursor: pointer;
            transition: transform 0.1s, background 0.1s;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.92);
            background: rgba(128, 222, 234, 0.25);
        }

        .card-icon {
            font-size: 22px;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 5px var(--ice-glow));
        }

        .card-label {
            font-size: 9px;
            text-align: center;
            color: #fff;
            line-height: 1.1;
            font-weight: 600;
        }

        .card.orange { background: linear-gradient(135deg, rgba(209, 125, 42, 0.4), rgba(168, 93, 30, 0.6)); }
        .card.green { background: linear-gradient(135deg, rgba(42, 138, 93, 0.4), rgba(30, 92, 65, 0.6)); }
        .card.purple { background: linear-gradient(135deg, rgba(138, 42, 138, 0.4), rgba(92, 30, 92, 0.6)); }
        .card.blue { background: linear-gradient(135deg, rgba(42, 106, 209, 0.4), rgba(30, 76, 138, 0.6)); }

        .gift-btn {
            background: linear-gradient(135deg, var(--accent-green), #00b248);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .gift-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            margin-top: 5px;
            border-top: 1px solid rgba(128, 222, 234, 0.1);
            padding-top: 8px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: var(--text-secondary);
            gap: 2px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue);
        }

        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="score-section">
        <div class="subtitle">ВАШ ЛЁД</div>
        <div class="balance" id="balance-wrapper">
            <span id="balance">0</span>
            <span class="ice-icon">🧊</span>
        </div>
        <div class="income-info">
            <span id="income-per-sec">+ 0/сек</span>
            <span id="income-per-click" class="income-per-click">+ 0/удар</span>
        </div>
    </div>

    <div class="game-area" id="game-area">
        <!-- Canvas для частиц осколков -->
        <canvas id="particles-canvas"></canvas>
        
        <div class="iceberg-container" id="iceberg-container">
            <div class="iceberg-glow"></div>
            
            <!-- SVG Айсберг (уменьшен, отражение уменьшено) -->
            <svg class="iceberg-svg" id="iceberg" viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="iceTopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                        <stop offset="25%" stop-color="#e0f7fa" stop-opacity="1"/>
                        <stop offset="60%" stop-color="#80deea" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#26c6da" stop-opacity="1"/>
                    </linearGradient>
                    
                    <linearGradient id="iceBottomGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#4dd0e1" stop-opacity="0.9"/>
                        <stop offset="50%" stop-color="#00838f" stop-opacity="0.7"/>
                        <stop offset="100%" stop-color="#004d40" stop-opacity="0.3"/>
                    </linearGradient>
                    
                    <radialGradient id="iceHighlight" cx="35%" cy="25%" r="50%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>
                    
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                
                <!-- ПОДВОДНАЯ ЧАСТЬ -->
                <path d="M 80 240 
                         C 60 280, 55 340, 90 375 
                         C 125 395, 195 395, 230 375 
                         C 265 340, 260 280, 240 240 
                         Z" 
                      fill="url(#iceBottomGradient)" 
                      filter="url(#glow)"
                      opacity="0.6"/>
                
                <!-- ОСНОВНАЯ НАДВОДНАЯ ЧАСТЬ -->
                <path d="M 90 240 
                         L 82 200 
                         C 78 170, 92 120, 112 90 
                         C 127 65, 150 48, 165 45 
                         C 183 43, 200 55, 215 78 
                         C 230 102, 235 140, 228 180 
                         L 222 240 
                         C 210 245, 100 245, 90 240
                         Z" 
                      fill="url(#iceTopGradient)"/>
                
                <!-- БОКОВЫЕ ГРАНИ -->
                <path d="M 90 240 
                         L 82 200 
                         C 78 170, 92 120, 112 90 
                         C 122 80, 132 72, 142 68
                         L 150 100
                         C 130 140, 125 190, 128 240
                         Z" 
                      fill="#b2ebf2" 
                      opacity="0.6"/>
                
                <path d="M 222 240 
                         L 228 180 
                         C 235 140, 230 102, 215 78 
                         C 210 70, 202 62, 193 58
                         L 188 90
                         C 200 120, 205 180, 200 240
                         Z" 
                      fill="#4dd0e1" 
                      opacity="0.5"/>
                
                <!-- БЛИК -->
                <path d="M 112 90 
                         C 127 65, 150 48, 165 45 
                         C 170 55, 168 85, 158 112
                         C 143 108, 125 100, 112 90
                         Z" 
                      fill="url(#iceHighlight)"/>
                
                <!-- ТРЕЩИНЫ -->
                <path d="M 148 85 L 145 145 L 155 165 L 148 220" 
                      stroke="#4dd0e1" 
                      stroke-width="1.5" 
                      fill="none" 
                      opacity="0.6"/>
                
                <path d="M 185 78 L 190 128 L 180 158" 
                      stroke="#26c6da" 
                      stroke-width="1" 
                      fill="none" 
                      opacity="0.5"/>
                
                <path d="M 118 172 L 132 192 L 122 222" 
                      stroke="#80deea" 
                      stroke-width="1" 
                      fill="none" 
                      opacity="0.4"/>
                
                <!-- ВНУТРЕННЯЯ ГРАНЬ -->
                <path d="M 130 120 
                         C 140 110, 158 105, 175 110 
                         C 180 130, 180 150, 175 170
                         C 158 165, 140 165, 130 170
                         C 125 150, 125 130, 130 120
                         Z" 
                      fill="#ffffff" 
                      opacity="0.15"/>
                
                <!-- ЛИНИЯ ВОДЫ -->
                <line x1="0" y1="240" x2="320" y2="240" 
                      stroke="#40c4ff" 
                      stroke-width="2" 
                      opacity="0.7"
                      filter="url(#glow)"/>
                
                <!-- ОТРАЖЕНИЕ (уменьшено!) -->
                <ellipse cx="160" cy="250" rx="55" ry="5" 
                         fill="#40c4ff" 
                         opacity="0.2" 
                         filter="url(#glow)"/>
            </svg>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="tabs">
            <div class="tab active">Меню</div>
            <div class="tab">Улучшения</div>
            <div class="tab">Бонусы</div>
            <div class="tab">Инвентарь</div>
        </div>

        <div class="gift-btn" onclick="tg.HapticFeedback.impactOccurred('light')">🎁</div>
        <div class="subtitle" style="text-align:left; margin-bottom: 5px; font-size: 11px;">Ещё льда?</div>

        <div class="cards-grid">
            <div class="card orange" onclick="buyUpgrade(1)">
                <div class="card-icon">⭐</div>
                <div class="card-label">Рейтинг</div>
            </div>
            <div class="card green" onclick="buyUpgrade(2)">
                <div class="card-icon">💸</div>
                <div class="card-label">Перевести</div>
            </div>
            <div class="card purple" onclick="buyUpgrade(3)">
                <div class="card-icon">🕒</div>
                <div class="card-label">История</div>
            </div>
            <div class="card blue" onclick="buyUpgrade(4)">
                <div class="card-icon">🛍️</div>
                <div class="card-label">Магазин</div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active">
                <span class="nav-icon">🧊</span>
                <span>Лёд</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Рейтинг</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚔️</span>
                <span>Боссы</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">🛡️</span>
                <span>Персонаж</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#050a1a');
            tg.setBackgroundColor('#050a1a');
        } else {
            tg = {
                close: () => alert("Это приложение для Telegram!"),
                HapticFeedback: {
                    impactOccurred: () => {},
                    notificationOccurred: () => {}
                },
                showAlert: (msg) => alert(msg)
            };
        }

        // --- Game State ---
        let balance = 0;
        let incomePerSecond = 0;
        let incomePerClick = 1;
        let upgradeLevel = 1;
        let upgradeCost = 50;

        const balanceEl = document.getElementById('balance');
        const balanceWrapper = document.getElementById('balance-wrapper');
        const incomeSecEl = document.getElementById('income-per-sec');
        const incomeClickEl = document.getElementById('income-per-click');
        const gameArea = document.getElementById('game-area');
        const iceberg = document.getElementById('iceberg');
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        // --- Canvas размер с учетом DPR (для четкости на retina) ---
        let canvasW = 0, canvasH = 0;
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = gameArea.getBoundingClientRect();
            canvasW = rect.width;
            canvasH = rect.height;
            canvas.width = canvasW * dpr;
            canvas.height = canvasH * dpr;
            canvas.style.width = canvasW + 'px';
            canvas.style.height = canvasH + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- Система частиц на Canvas ---
        const particles = [];
        const MAX_PARTICLES = 200; // Защита от перегрузки

        function spawnParticles(x, y, count) {
            for (let i = 0; i < count; i++) {
                if (particles.length >= MAX_PARTICLES) break;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 3;
                const size = Math.random() * 5 + 3;
                
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2, // Немного вверх
                    size: size,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.3,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.015,
                    color: Math.random() > 0.5 ? '#ffffff' : '#a0e9ff'
                });
            }
        }

        let lastTime = 0;
        function animateParticles(time) {
            const dt = Math.min((time - lastTime) / 16.67, 2); // Нормализация к 60fps
            lastTime = time;
            
            ctx.clearRect(0, 0, canvasW, canvasH);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                
                // Физика
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.35 * dt; // Гравитация
                p.vx *= 0.98; // Трение
                p.rotation += p.rotSpeed * dt;
                p.life -= p.decay * dt;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                // Рисуем ромб (кристалл)
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = '#80deea';
                ctx.shadowBlur = 8;
                
                ctx.beginPath();
                ctx.moveTo(0, -p.size);
                ctx.lineTo(p.size * 0.7, 0);
                ctx.lineTo(0, p.size);
                ctx.lineTo(-p.size * 0.7, 0);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }
            
            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);

        // --- Форматирование чисел ---
        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' млрд';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' млн';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + ' тыс.';
            return Math.floor(num).toString();
        }

        function updateUI() {
            balanceEl.textContent = formatNumber(balance);
            incomeSecEl.textContent = `+ ${formatNumber(incomePerSecond)}/сек`;
            incomeClickEl.textContent = `+ ${formatNumber(incomePerClick)}/удар`;
        }

        // --- Пассивный доход ---
        setInterval(() => {
            if (incomePerSecond > 0) {
                balance += incomePerSecond;
                updateUI();
            }
        }, 1000);

        // --- Клик по айсбергу ---
        gameArea.addEventListener('click', (e) => {
            const rect = gameArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            balance += incomePerClick;
            updateUI();

            // Эффекты
            spawnParticles(x, y, 8);
            createFloatingText(incomePerClick, x, y);
            createFlyingIce(e.clientX, e.clientY);
            shakeIceberg();
            pulseBalance();
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        function shakeIceberg() {
            iceberg.classList.remove('shake');
            void iceberg.offsetWidth; 
            iceberg.classList.add('shake');
        }

        function pulseBalance() {
            balanceWrapper.classList.remove('pulse');
            void balanceWrapper.offsetWidth;
            balanceWrapper.classList.add('pulse');
        }

        // --- Всплывающий текст ---
        function createFloatingText(amount, x, y) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.textContent = '+' + formatNumber(amount);
            el.style.left = (x - 20) + 'px';
            el.style.top = (y - 20) + 'px';
            gameArea.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

        // --- Летящий кусок льда к балансу ---
        function createFlyingIce(startX, startY) {
            const ice = document.createElement('div');
            ice.className = 'flying-ice';
            ice.textContent = '🧊';
            ice.style.left = startX + 'px';
            ice.style.top = startY + 'px';
            document.body.appendChild(ice);
            
            // Получаем координаты цели (иконки льда в балансе)
            const target = document.querySelector('.ice-icon');
            const targetRect = target.getBoundingClientRect();
            const targetX = targetRect.left + targetRect.width / 2;
            const targetY = targetRect.top + targetRect.height / 2;
            
            // Анимация через requestAnimationFrame для плавности и контроля
            const startTime = performance.now();
            const duration = 600; // мс
            const startXVal = startX;
            const startYVal = startY;
            const deltaX = targetX - startXVal;
            const deltaY = targetY - startYVal;
            
            // Контрольная точка для дуги (изгиб вверх)
            const controlX = startXVal + deltaX * 0.5;
            const controlY = Math.min(startYVal, targetY) - 100;
            
            function animate(now) {
                const t = Math.min((now - startTime) / duration, 1);
                // Квадратичная кривая Безье
                const mt = 1 - t;
                const x = mt * mt * startXVal + 2 * mt * t * controlX + t * t * targetX;
                const y = mt * mt * startYVal + 2 * mt * t * controlY + t * t * targetY;
                
                const scale = 1 - t * 0.5;
                const opacity = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
                
                ice.style.transform = `translate(${x - startXVal}px, ${y - startYVal}px) scale(${scale})`;
                ice.style.opacity = opacity;
                
                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    ice.remove();
                }
            }
            
            requestAnimationFrame(animate);
        }

        // --- Улучшения ---
        function buyUpgrade(type) {
            if (balance >= upgradeCost) {
                balance -= upgradeCost;
                upgradeLevel++;
                upgradeCost = Math.floor(upgradeCost * 1.6);
                
                if (type === 1) incomePerClick += 2;
                if (type === 2) incomePerSecond += 5;
                if (type === 3) incomePerClick += 10;
                if (type === 4) incomePerSecond += 25;
                
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        updateUI();
    </script>
</body>
</html>
