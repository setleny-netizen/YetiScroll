<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yeti Scroll — TG Mini App</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Цвета из скриншота */
            --bg-color: #121212;
            --panel-color: #1c1c1e;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --accent-green: #00d26a;
            --accent-blue: #2b8aff;
            
            /* Безопасные зоны для iPhone (челка и низ) */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; /* Убираем синюю вспышку при тапе */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Запрещаем скролл всей страницы */
            height: 100vh;
            height: 100dvh; /* Динамическая высота для мобильных браузеров */
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top); /* Отступ сверху для челки */
            padding-bottom: var(--safe-bottom); /* Отступ снизу для панели */
        }

        /* --- Header (Верхняя панель) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: 600;
            background-color: var(--bg-color);
            z-index: 10;
        }

        .header-title {
            flex: 1;
            text-align: center;
        }

        .close-btn, .menu-btn {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 22px;
        }

        /* --- Score Section (Счет) --- */
        .score-section {
            text-align: center;
            padding: 5px 0;
            z-index: 10;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .balance {
            font-size: 44px;
            font-weight: 800;
            margin: 5px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 20px rgba(0, 210, 106, 0.3);
        }

        .yeti-icon {
            font-size: 32px;
        }

        .income-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 15px;
            font-weight: 700;
        }

        .income-per-sec { color: var(--accent-green); }
        .income-per-scroll { color: var(--accent-blue); }

        /* --- Main Game Area (Игровая зона) --- */
        .game-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
            touch-action: none; /* Отключаем стандартный скролл в этой зоне */
            cursor: grab;
        }

        .game-area:active {
            cursor: grabbing;
        }

        /* Рулон */
        .scroll-container {
            width: 200px;
            height: 300px;
            position: relative;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            will-change: height; /* Оптимизация анимации */
        }

        .roll-top {
            width: 170px;
            height: 65px;
            background: linear-gradient(90deg, #333, #555, #333);
            border-radius: 35px;
            position: relative;
            z-index: 2;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 2px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .roll-hole {
            width: 45px;
            height: 45px;
            background-color: var(--bg-color);
            border-radius: 50%;
            box-shadow: inset 0 0 15px #000;
        }

        .paper {
            width: 150px;
            background: linear-gradient(180deg, #e0f7fa, #b2ebf2);
            flex: 1;
            margin-top: -12px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            position: relative;
            box-shadow: 0 0 30px rgba(178, 235, 242, 0.4);
            overflow: hidden;
            background-image: radial-gradient(#ffffff 2px, transparent 2px);
            background-size: 25px 25px;
        }
        
        /* Йети */
        .yeti-char {
            position: absolute;
            bottom: -25px;
            font-size: 55px;
            z-index: 3;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.6));
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.05); }
        }

        .swipe-hint {
            position: absolute;
            bottom: 10px;
            color: #666;
            font-size: 12px;
            text-align: center;
            width: 100%;
            font-weight: 500;
        }

        /* --- Bottom Panel (Нижняя панель) --- */
        .bottom-panel {
            background-color: var(--panel-color);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 15px;
            padding-bottom: 10px;
            z-index: 20;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
        }

        .tab.active {
            color: var(--accent-green);
            position: relative;
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-green);
            border-radius: 2px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .card {
            background-color: #2c2c2e;
            border-radius: 14px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
            cursor: pointer;
            transition: transform 0.1s, filter 0.1s;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:active {
            transform: scale(0.92);
            filter: brightness(0.8);
        }

        .card-icon {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .card-label {
            font-size: 9px;
            text-align: center;
            color: #fff;
            line-height: 1.1;
            font-weight: 600;
        }

        .card.orange { background: linear-gradient(135deg, #d17d2a, #a85d1e); }
        .card.green { background: linear-gradient(135deg, #2a8a5d, #1e5c41); }
        .card.purple { background: linear-gradient(135deg, #8a2a8a, #5c1e5c); }
        .card.blue { background: linear-gradient(135deg, #2a6ad1, #1e4c8a); }

        .gift-btn {
            background-color: var(--accent-green);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 10px;
            box-shadow: 0 4px 0 #009624;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .gift-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            margin-top: 5px;
            border-top: 1px solid #333;
            padding-top: 8px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: var(--text-secondary);
            gap: 2px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-green);
        }

        .nav-icon {
            font-size: 18px;
        }

        /* Всплывающие цифры */
        .float-text {
            position: absolute;
            color: #fff;
            font-weight: 800;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            font-size: 18px;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Верхняя панель (имитация Telegram Header) -->
    <header>
        <div class="close-btn" onclick="tg.close()">✕</div>
        <div class="header-title">Yeti Scroll</div>
        <div class="menu-btn">⋮</div>
    </header>

    <!-- Счет -->
    <div class="score-section">
        <div class="subtitle">ВАШ СЧЁТ</div>
        <div class="balance">
            <span id="balance">0</span>
            <span class="yeti-icon">🦶</span>
        </div>
        <div class="income-info">
            <span id="income-per-sec">+ 0/сек</span>
            <span id="income-per-scroll" class="income-per-scroll">+ 0/скролл</span>
        </div>
    </div>

    <!-- Игровая зона -->
    <div class="game-area" id="game-area">
        <div class="scroll-container" id="scroll-container">
            <div class="roll-top">
                <div class="roll-hole"></div>
            </div>
            <div class="paper" id="paper"></div>
            <div class="yeti-char">🦍</div>
        </div>
        <div class="swipe-hint">Проведи вниз на всю длину листа</div>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-panel">
        <div class="tabs">
            <div class="tab active">Меню</div>
            <div class="tab">Улучшения</div>
            <div class="tab">Бонусы</div>
            <div class="tab">Инвентарь</div>
        </div>

        <div class="gift-btn" onclick="tg.HapticFeedback.impactOccurred('light')">🎁</div>
        <div class="subtitle" style="text-align:left; margin-bottom: 5px; font-size: 11px;">Ещё бумаги?</div>

        <div class="cards-grid">
            <div class="card orange" onclick="buyUpgrade(1)">
                <div class="card-icon">⭐</div>
                <div class="card-label">Рейтинг</div>
            </div>
            <div class="card green" onclick="buyUpgrade(2)">
                <div class="card-icon">💸</div>
                <div class="card-label">Перевести</div>
            </div>
            <div class="card purple" onclick="buyUpgrade(3)">
                <div class="card-icon">🕒</div>
                <div class="card-label">История</div>
            </div>
            <div class="card blue" onclick="buyUpgrade(4)">
                <div class="card-icon">🛍️</div>
                <div class="card-label">Магазин</div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active">
                <span class="nav-icon">🧻</span>
                <span>Снег</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Рейтинг</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚔️</span>
                <span>Боссы</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">🛡️</span>
                <span>Персонаж</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </div>
        </div>
    </div>

    <script>
        // --- Инициализация Telegram Web App ---
        let tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand(); // Разворачиваем на весь экран
            // Устанавливаем цвет хедера в тон приложения
            tg.setHeaderColor('#121212');
            tg.setBackgroundColor('#121212');
        } else {
            // Заглушка, если открыто вне Telegram
            tg = {
                close: () => alert("Это приложение для Telegram!"),
                HapticFeedback: {
                    impactOccurred: () => {},
                    notificationOccurred: () => {}
                }
            };
        }

        // --- Игровое состояние ---
        let balance = 0;
        let incomePerSecond = 0;
        let incomePerScroll = 10;
        let upgradeLevel = 1;
        let upgradeCost = 100;

        // --- DOM Элементы ---
        const balanceEl = document.getElementById('balance');
        const incomeSecEl = document.getElementById('income-per-sec');
        const incomeScrollEl = document.getElementById('income-per-scroll');
        const gameArea = document.getElementById('game-area');
        const paperEl = document.getElementById('paper');
        const scrollContainer = document.getElementById('scroll-container');

        // --- Форматирование чисел ---
        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' млрд';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' млн';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + ' тыс.';
            return Math.floor(num).toString();
        }

        function updateUI() {
            balanceEl.textContent = formatNumber(balance);
            incomeSecEl.textContent = `+ ${formatNumber(incomePerSecond)}/сек`;
            incomeScrollEl.textContent = `+ ${formatNumber(incomePerScroll)}/скролл`;
        }

        // --- Доход в секунду ---
        setInterval(() => {
            if (incomePerSecond > 0) {
                balance += incomePerSecond;
                updateUI();
            }
        }, 1000);

        // --- Всплывающий текст ---
        function createFloatingText(amount, x, y) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.textContent = '+' + formatNumber(amount);
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = '#00d26a';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // --- Механика Свайпа ---
        let isDragging = false;
        let startY = 0;
        let currentHeight = 300;
        const maxHeight = 500;
        const minHeight = 100;

        gameArea.addEventListener('mousedown', startDrag);
        gameArea.addEventListener('touchstart', startDrag, { passive: false });

        function startDrag(e) {
            isDragging = true;
            startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            paperEl.style.transition = 'none';
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, { passive: false });

        function drag(e) {
            if (!isDragging) return;

            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const deltaY = clientY - startY;

            let newHeight = currentHeight + deltaY;
            if (newHeight > maxHeight) newHeight = maxHeight;
            if (newHeight < minHeight) newHeight = minHeight;

            scrollContainer.style.height = newHeight + 'px';

            // Если дотянули до конца — отрываем
            if (newHeight >= maxHeight - 10) {
                performScroll();
                scrollContainer.style.transition = 'height 0.2s ease-out';
                scrollContainer.style.height = '300px';
                currentHeight = 300;
                
                // Вибрация при успешном свайпе
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                currentHeight = newHeight;
            }
        }

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            
            if (currentHeight < maxHeight - 10) {
                scrollContainer.style.transition = 'height 0.2s ease-out';
                scrollContainer.style.height = '300px';
                currentHeight = 300;
            }
        }

        function performScroll() {
            const reward = incomePerScroll;
            balance += reward;
            
            const rect = gameArea.getBoundingClientRect();
            const x = rect.width / 2;
            const y = rect.height / 2;
            createFloatingText(reward, x, y);
            
            updateUI();
        }

        // --- Улучшения ---
        function buyUpgrade(type) {
            if (balance >= upgradeCost) {
                balance -= upgradeCost;
                upgradeLevel++;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                
                if (type === 1) incomePerScroll += 5;
                if (type === 2) incomePerSecond += 10;
                if (type === 3) incomePerScroll += 20;
                if (type === 4) incomePerSecond += 50;
                
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                // Можно показать всплывашку вместо alert
                tg.showAlert("Недостаточно средств! Нужно " + formatNumber(upgradeCost));
            }
        }

        // --- Старт ---
        updateUI();
    </script>
</body>
</html>
