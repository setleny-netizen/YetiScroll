<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ice Crystal Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #03060f;
            --accent-green: #00e676;
            --accent-blue: #40c4ff;
            --text-main: #ffffff;
            --text-secondary: #78909c;
            --panel-bg: rgba(10, 21, 48, 0.85);
            
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #03060f;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        /* ============================================
           ФОНОВЫЙ СЛОЙ
           ============================================ */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .stars-bg {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(1px 1px at 20% 30%, #fff, transparent),
                radial-gradient(1px 1px at 60% 70%, #fff, transparent),
                radial-gradient(1px 1px at 80% 20%, #b3e5fc, transparent),
                radial-gradient(1px 1px at 30% 80%, #fff, transparent),
                radial-gradient(1px 1px at 90% 50%, #b3e5fc, transparent),
                radial-gradient(1px 1px at 10% 60%, #fff, transparent),
                radial-gradient(1px 1px at 50% 10%, #fff, transparent),
                radial-gradient(1px 1px at 70% 90%, #b3e5fc, transparent);
            opacity: 0.5;
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        .crystal-wrapper {
            position: absolute;
            top: 43%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 280px;
            pointer-events: auto;
            cursor: pointer;
            clip-path: polygon(50% 0%, 95% 35%, 88% 75%, 50% 100%, 12% 75%, 5% 35%);
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            transform: translate(-50%, -50%);
            animation: orbitRotate 12s linear infinite;
            pointer-events: none;
        }

        .orbit.reverse {
            width: 400px;
            height: 400px;
            animation: orbitRotate 18s linear infinite reverse;
        }

        @keyframes orbitRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .shard {
            position: absolute;
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #ffffff, #4fc3f7);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            opacity: 0.8;
        }

        .shard:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
        .shard:nth-child(2) { bottom: 0; left: 50%; transform: translateX(-50%); }
        .shard:nth-child(3) { left: 0; top: 50%; transform: translateY(-50%); }
        .shard:nth-child(4) { right: 0; top: 50%; transform: translateY(-50%); }
        .shard:nth-child(5) { top: 15%; left: 15%; }
        .shard:nth-child(6) { bottom: 15%; right: 15%; }

        .crystal {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .crystal.clicked {
            animation: crystalClick 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes crystalClick {
            0% { transform: scale(1); }
            40% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }

        .crystal-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* ============================================
           UI СЛОЙ
           ============================================ */
        .app-layer {
            position: relative;
            z-index: 10;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            pointer-events: none;
        }

        .score-section,
        .bottom-panel {
            pointer-events: auto;
        }

        .score-section {
            text-align: center;
            padding: 15px 0 0 0;
            flex-shrink: 0;
            position: relative;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .balance {
            font-size: 44px;
            font-weight: 900;
            margin: 4px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            transition: transform 0.15s;
        }

        .balance.pulse {
            transform: scale(1.1);
        }

        /* Эмодзи вместо SVG иконки */
        .ice-icon {
            font-size: 36px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .income-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 14px;
            font-weight: 700;
        }

        .income-per-sec { color: var(--accent-green); }
        .income-per-click { color: var(--accent-blue); }

        .empty-zone {
            flex: 1;
            min-height: 0;
        }

        .top-btn {
            position: absolute;
            top: 8px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.4);
            color: #ff5252;
            font-size: 14px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 100;
            transition: transform 0.1s, background 0.15s;
            right: 10px;
        }

        .top-btn:active {
            transform: scale(0.9);
            background: rgba(255, 77, 77, 0.3);
        }

        /* --- Bottom Panel --- */
        .bottom-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 12px 15px 10px 15px;
            border-top: 1px solid rgba(79, 195, 247, 0.15);
            flex-shrink: 0;
        }

        .main-tabs {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(79, 195, 247, 0.1);
            padding-bottom: 8px;
        }

        .main-tab {
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            padding: 4px 8px;
            position: relative;
        }

        .main-tab.active {
            color: var(--accent-blue);
        }

        .main-tab.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-blue);
            border-radius: 2px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(79, 195, 247, 0.15);
            border-radius: 14px;
            padding: 8px 4px 6px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            aspect-ratio: 1/1.35;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s, opacity 0.15s;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .card:active {
            transform: scale(0.95);
            background: rgba(79, 195, 247, 0.2);
        }

        .card.locked {
            opacity: 0.6;
        }

        .card-icon {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .card-title {
            font-size: 9px;
            color: #fff;
            font-weight: 700;
            line-height: 1.1;
        }

        .card-effect {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent-green);
            line-height: 1;
        }

        .card-cost {
            font-size: 11px;
            font-weight: 800;
            color: #ffb74d;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .card-cost.affordable {
            color: var(--accent-green);
        }

        .card-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.4);
        }

        .card-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #00e676);
            width: 0%;
            transition: width 0.3s ease-out;
            border-radius: 0 2px 2px 0;
        }

        .card-progress-fill.full {
            background: linear-gradient(90deg, #00e676, #76ff03);
            box-shadow: 0 0 6px rgba(0, 230, 118, 0.6);
        }

        .card-level {
            position: absolute;
            top: 4px;
            right: 5px;
            font-size: 8px;
            font-weight: 800;
            color: var(--accent-blue);
            background: rgba(64, 196, 255, 0.15);
            padding: 1px 5px;
            border-radius: 6px;
        }

        .card.orange { background: linear-gradient(135deg, rgba(209, 125, 42, 0.35), rgba(168, 93, 30, 0.55)); border-color: rgba(255, 183, 77, 0.3); }
        .card.green { background: linear-gradient(135deg, rgba(42, 138, 93, 0.35), rgba(30, 92, 65, 0.55)); border-color: rgba(129, 199, 132, 0.3); }
        .card.purple { background: linear-gradient(135deg, rgba(138, 42, 138, 0.35), rgba(92, 30, 92, 0.55)); border-color: rgba(206, 147, 216, 0.3); }
        .card.blue { background: linear-gradient(135deg, rgba(42, 106, 209, 0.35), rgba(30, 76, 138, 0.55)); border-color: rgba(100, 181, 246, 0.3); }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            margin-top: 5px;
            border-top: 1px solid rgba(79, 195, 247, 0.1);
            padding-top: 8px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: var(--text-secondary);
            gap: 2px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.15s;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- Floating text --- */
        .float-text {
            position: fixed;
            color: #ffffff;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 0.9s ease-out forwards;
            z-index: 100;
            font-size: 22px;
            font-variant-numeric: tabular-nums;
            will-change: transform, opacity;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            30% { opacity: 1; transform: translateY(-25px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-80px) scale(1); }
        }

        /* --- Flying ice --- */
        .flying-ice {
            position: fixed;
            font-size: 22px;
            pointer-events: none;
            z-index: 200;
            will-change: transform, opacity;
        }

        /* --- Модалки --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: linear-gradient(135deg, #0a1530, #050a1a);
            border: 1px solid rgba(79, 195, 247, 0.3);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #fff;
        }

        .modal-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .modal-reward {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent-green);
            margin: 12px 0;
            font-variant-numeric: tabular-nums;
        }

        .modal-btn {
            background: linear-gradient(135deg, var(--accent-blue), #0288d1);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.1s;
            font-family: inherit;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        /* --- Лидерборд --- */
        .lb-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .lb-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(79, 195, 247, 0.08);
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 13px;
        }

        .lb-row.me {
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid rgba(0, 230, 118, 0.4);
        }

        .lb-rank {
            font-weight: 900;
            color: var(--accent-blue);
            min-width: 24px;
            text-align: center;
        }

        .lb-rank.top1 { color: #ffd700; }
        .lb-rank.top2 { color: #c0c0c0; }
        .lb-rank.top3 { color: #cd7f32; }

        .lb-name {
            flex: 1;
            text-align: left;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-score {
            font-weight: 800;
            color: var(--accent-green);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <div class="bg-layer">
        <div class="stars-bg"></div>
        
        <div class="crystal-wrapper" id="crystal-wrapper">
            <div class="orbit">
                <div class="shard"></div>
                <div class="shard"></div>
                <div class="shard"></div>
                <div class="shard"></div>
            </div>
            <div class="orbit reverse">
                <div class="shard"></div>
                <div class="shard"></div>
            </div>
            
            <div class="crystal" id="crystal">
                <svg class="crystal-svg" viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="crystalFace1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="30%" stop-color="#e1f5fe"/>
                            <stop offset="70%" stop-color="#81d4fa"/>
                            <stop offset="100%" stop-color="#29b6f6"/>
                        </linearGradient>
                        <linearGradient id="crystalFace2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4fc3f7"/>
                            <stop offset="100%" stop-color="#0288d1"/>
                        </linearGradient>
                        <linearGradient id="crystalFace3" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0288d1"/>
                            <stop offset="100%" stop-color="#01579b"/>
                        </linearGradient>
                        <linearGradient id="crystalFace4" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#b3e5fc"/>
                            <stop offset="100%" stop-color="#4fc3f7"/>
                        </linearGradient>
                        <radialGradient id="crystalShine" cx="30%" cy="20%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                    
                    <polygon points="110,270 50,200 110,170 170,200" fill="url(#crystalFace3)"/>
                    <polygon points="110,270 50,200 80,195 110,220" fill="url(#crystalFace2)" opacity="0.8"/>
                    <polygon points="110,270 170,200 140,195 110,220" fill="url(#crystalFace3)" opacity="0.9"/>
                    
                    <polygon points="50,200 30,100 110,40 110,170" fill="url(#crystalFace4)"/>
                    <polygon points="110,40 110,170 50,200 30,100" fill="url(#crystalFace1)" opacity="0.5"/>
                    <polygon points="110,40 190,100 170,200 110,170" fill="url(#crystalFace2)"/>
                    
                    <polygon points="110,40 190,100 110,120 30,100" fill="url(#crystalFace1)"/>
                    <polygon points="110,40 190,100 110,120" fill="url(#crystalFace2)" opacity="0.6"/>
                    
                    <line x1="110" y1="40" x2="110" y2="170" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
                    <line x1="110" y1="170" x2="110" y2="270" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
                    
                    <polygon points="60,120 100,70 130,90 80,150" fill="url(#crystalShine)" opacity="0.7"/>
                    <polygon points="130,110 155,90 165,105 140,125" fill="#ffffff" opacity="0.4"/>
                    
                    <polygon points="80,100 110,80 130,140 90,170" fill="#ffffff" opacity="0.15"/>
                    <polygon points="130,140 160,120 170,180 140,200" fill="#01579b" opacity="0.2"/>
                    
                    <line x1="110" y1="40" x2="30" y2="100" stroke="#b3e5fc" stroke-width="1" opacity="0.7"/>
                    <line x1="110" y1="40" x2="190" y2="100" stroke="#0288d1" stroke-width="1" opacity="0.7"/>
                    <line x1="30" y1="100" x2="50" y2="200" stroke="#81d4fa" stroke-width="1" opacity="0.6"/>
                    <line x1="190" y1="100" x2="170" y2="200" stroke="#01579b" stroke-width="1" opacity="0.6"/>
                    
                    <ellipse cx="110" cy="120" rx="30" ry="50" fill="#ffffff" opacity="0.15"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="app-layer">
        
        <div class="score-section">
            <div class="top-btn" id="reset-btn" title="Сброс">↺</div>
            <div class="subtitle">ВАШ ЛЁД</div>
            <div class="balance" id="balance-wrapper">
                <span id="balance">0</span>
                <span class="ice-icon">🧊</span>
            </div>
            <div class="income-info">
                <span id="income-per-sec">+ 0/сек</span>
                <span id="income-per-click" class="income-per-click">+ 1/удар</span>
            </div>
        </div>

        <div class="empty-zone"></div>

        <div class="bottom-panel">
            <div class="main-tabs">
                <div class="main-tab active" data-tab="mining">Добыча</div>
                <div class="main-tab" data-tab="pickaxe">Кирка</div>
            </div>

            <div class="cards-grid" id="cards-grid"></div>

            <div class="nav-bar">
                <div class="nav-item active">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 20,7 20,17 12,22 4,17 4,7"/></svg>
                    </span>
                    <span>Лёд</span>
                </div>
                <div class="nav-item" id="nav-rating">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                    </span>
                    <span>Рейтинг</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/>
                        </svg>
                    </span>
                    <span>Боссы</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </span>
                    <span>Персонаж</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <span>Профиль</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка оффлайн-дохода -->
    <div class="modal-overlay" id="offline-modal">
        <div class="modal">
            <div class="modal-icon">❄️</div>
            <div class="modal-title">С возвращением!</div>
            <div class="modal-text">Пока вас не было, кристалл добыл:</div>
            <div class="modal-reward" id="offline-amount">0</div>
            <div class="modal-text" id="offline-time"></div>
            <button class="modal-btn" onclick="closeOfflineModal()">Забрать</button>
        </div>
    </div>

    <!-- Модалка лидерборда -->
    <div class="modal-overlay" id="lb-modal">
        <div class="modal">
            <div class="modal-icon">🏆</div>
            <div class="modal-title">Топ игроков</div>
            <div class="lb-list" id="lb-list">
                <div class="modal-text">Загрузка...</div>
            </div>
            <button class="modal-btn" onclick="closeLeaderboard()">Закрыть</button>
        </div>
    </div>

    <script>
        // ==================================================
        // ⚙️ НАСТРОЙКИ ЛИДЕРБОРДА
        // ==================================================
        const LEADERBOARD_API = 'https://script.google.com/macros/s/AKfycbzPH2jYlMEAuFxBcMkADEbrHg0qw1To0to6d3Eb574Lb9wY4j4_MRqpV5n-lCSCLeiG/exec';
        
        // ==================================================

        // === TELEGRAM ===
        let tg = window.Telegram?.WebApp;
        let TG_USER = null;
        
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#03060f');
            tg.setBackgroundColor('#03060f');
            
            if (tg.initDataUnsafe?.user) {
                TG_USER = tg.initDataUnsafe.user;
            }
        } else {
            tg = {
                close: () => {},
                HapticFeedback: { impactOccurred: () => {}, notificationOccurred: () => {} },
                showAlert: (msg) => alert(msg),
                showConfirm: (msg, cb) => { if (confirm(msg)) cb(); }
            };
        }

        // === ДАННЫЕ АПГРЕЙДОВ ===
        const MINING_UPGRADES = [
            { id: 'auto1', name: 'Кристалл', baseCost: 25, costMult: 1.15, effect: 1, icon: 'cyan', color: 'orange' },
            { id: 'auto2', name: 'Ледник',   baseCost: 250, costMult: 1.15, effect: 8, icon: 'blue', color: 'green' },
            { id: 'auto3', name: 'Айсберг',  baseCost: 2500, costMult: 1.15, effect: 45, icon: 'purple', color: 'purple' },
            { id: 'auto4', name: 'Глетчер',  baseCost: 25000, costMult: 1.15, effect: 260, icon: 'deep', color: 'blue' },
        ];

        const CLICK_UPGRADES = [
            { id: 'click1', name: 'Рука',   baseCost: 15,  costMult: 1.4, effect: 1, icon: 'hand', color: 'orange' },
            { id: 'click2', name: 'Кирка',  baseCost: 150, costMult: 1.4, effect: 5, icon: 'pick', color: 'green' },
            { id: 'click3', name: 'Дрель',  baseCost: 1500, costMult: 1.4, effect: 25, icon: 'drill', color: 'purple' },
            { id: 'click4', name: 'Лазер',  baseCost: 15000, costMult: 1.4, effect: 120, icon: 'laser', color: 'blue' },
        ];

        const ICONS = {
            cyan: `<svg viewBox="0 0 24 24" fill="#4fc3f7"><polygon points="12,2 20,7 20,17 12,22 4,17 4,7"/></svg>`,
            blue: `<svg viewBox="0 0 24 24" fill="#29b6f6"><polygon points="12,2 20,7 20,17 12,22 4,17 4,7"/><polygon points="12,2 20,7 12,10" fill="#b3e5fc"/></svg>`,
            purple: `<svg viewBox="0 0 24 24" fill="#ba68c8"><polygon points="12,2 20,7 20,17 12,22 4,17 4,7"/><polygon points="12,2 20,7 12,10" fill="#e1bee7"/></svg>`,
            deep: `<svg viewBox="0 0 24 24" fill="#0277bd"><polygon points="12,2 20,7 20,17 12,22 4,17 4,7"/><polygon points="12,2 20,7 12,10" fill="#4fc3f7"/></svg>`,
            hand: `<svg viewBox="0 0 24 24" fill="none" stroke="#ffd54f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v10"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>`,
            pick: `<svg viewBox="0 0 24 24" fill="none" stroke="#81c784" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>`,
            drill: `<svg viewBox="0 0 24 24" fill="none" stroke="#ce93d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 6l4-3 4 3"/><path d="M8 18l4 3 4-3"/><circle cx="12" cy="12" r="3"/></svg>`,
            laser: `<svg viewBox="0 0 24 24" fill="none" stroke="#64b5f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>`,
        };

        // === СОСТОЯНИЕ ИГРЫ ===
        const SAVE_KEY = 'ice_crystal_clicker_save_v2';
        const OFFLINE_MAX_HOURS = 4;
        const OFFLINE_RATE = 0.5;
        
        let state = {
            balance: 0,
            clickIncome: 1,
            autoIncome: 0,
            activeTab: 'mining',
            upgrades: {},
            lastSeen: Date.now()
        };

        [...MINING_UPGRADES, ...CLICK_UPGRADES].forEach(u => {
            state.upgrades[u.id] = state.upgrades[u.id] || 0;
        });

        function loadState() {
            try {
                const saved = localStorage.getItem(SAVE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                    [...MINING_UPGRADES, ...CLICK_UPGRADES].forEach(u => {
                        if (state.upgrades[u.id] === undefined) state.upgrades[u.id] = 0;
                    });
                }
            } catch (e) { console.warn('Load error', e); }
        }

        function saveState() {
            try {
                state.lastSeen = Date.now();
                localStorage.setItem(SAVE_KEY, JSON.stringify(state));
            } catch (e) { console.warn('Save error', e); }
        }

        function formatNumber(num) {
            if (num >= 1e15) return (num / 1e15).toFixed(2) + ' квдрлн';
            if (num >= 1e12) return (num / 1e12).toFixed(2) + ' трлн';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' млрд';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' млн';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + ' тыс.';
            return Math.floor(num).toString();
        }

        function formatTime(seconds) {
            if (seconds < 60) return `${Math.floor(seconds)} сек`;
            if (seconds < 3600) return `${Math.floor(seconds/60)} мин`;
            return `${Math.floor(seconds/3600)} ч ${Math.floor((seconds%3600)/60)} мин`;
        }

        function getCost(upgrade) {
            const level = state.upgrades[upgrade.id] || 0;
            return Math.floor(upgrade.baseCost * Math.pow(upgrade.costMult, level));
        }

        function recalcIncome() {
            let clickBonus = 0;
            let autoBonus = 0;
            
            CLICK_UPGRADES.forEach(u => {
                clickBonus += u.effect * (state.upgrades[u.id] || 0);
            });
            MINING_UPGRADES.forEach(u => {
                autoBonus += u.effect * (state.upgrades[u.id] || 0);
            });
            
            state.clickIncome = 1 + clickBonus;
            state.autoIncome = autoBonus;
        }

        const balanceEl = document.getElementById('balance');
        const balanceWrapper = document.getElementById('balance-wrapper');
        const incomeSecEl = document.getElementById('income-per-sec');
        const incomeClickEl = document.getElementById('income-per-click');
        const crystalWrapper = document.getElementById('crystal-wrapper');
        const crystal = document.getElementById('crystal');
        const cardsGrid = document.getElementById('cards-grid');
        const navRating = document.getElementById('nav-rating');

        function updateUI() {
            balanceEl.textContent = formatNumber(state.balance);
            incomeSecEl.textContent = `+ ${formatNumber(state.autoIncome)}/сек`;
            incomeClickEl.textContent = `+ ${formatNumber(state.clickIncome)}/удар`;
        }

        function renderCards() {
            const list = state.activeTab === 'mining' ? MINING_UPGRADES : CLICK_UPGRADES;
            
            cardsGrid.innerHTML = list.map(u => {
                const level = state.upgrades[u.id] || 0;
                const cost = getCost(u);
                const canAfford = state.balance >= cost;
                const totalEffect = u.effect * level;
                const progress = Math.min(100, (state.balance / cost) * 100);
                
                let effectLabel;
                if (state.activeTab === 'mining') {
                    effectLabel = `+${formatNumber(totalEffect)}/сек`;
                } else {
                    effectLabel = `+${formatNumber(totalEffect)}/удар`;
                }
                
                return `
                    <div class="card ${u.color} ${canAfford ? '' : 'locked'}" data-id="${u.id}">
                        ${level > 0 ? `<div class="card-level">Ур.${level}</div>` : ''}
                        <div class="card-icon">${ICONS[u.icon]}</div>
                        <div class="card-title">${u.name}</div>
                        <div class="card-effect">${effectLabel}</div>
                        <div class="card-cost ${canAfford ? 'affordable' : ''}">${formatNumber(cost)}</div>
                        <div class="card-progress">
                            <div class="card-progress-fill ${canAfford ? 'full' : ''}" style="width:${progress}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
            
            cardsGrid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => {
                    tryBuyUpgrade(card.dataset.id);
                });
            });
        }

        function tryBuyUpgrade(id) {
            const all = [...MINING_UPGRADES, ...CLICK_UPGRADES];
            const u = all.find(x => x.id === id);
            if (!u) return;
            
            const cost = getCost(u);
            if (state.balance < cost) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }
            
            state.balance -= cost;
            state.upgrades[id] = (state.upgrades[id] || 0) + 1;
            
            recalcIncome();
            updateUI();
            renderCards();
            saveState();
            
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        document.querySelectorAll('.main-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                state.activeTab = tab.dataset.tab;
                renderCards();
                saveState();
            });
        });

        crystalWrapper.addEventListener('click', (e) => {
            e.stopPropagation();
            const x = e.clientX;
            const y = e.clientY;

            state.balance += state.clickIncome;
            updateUI();
            renderCards();

            createFloatingText(state.clickIncome, x, y);
            clickCrystal();
            pulseBalance();
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            throttledSave();
        });

        function clickCrystal() {
            crystal.classList.remove('clicked');
            void crystal.offsetWidth;
            crystal.classList.add('clicked');
        }

        function pulseBalance() {
            balanceWrapper.classList.remove('pulse');
            void balanceWrapper.offsetWidth;
            balanceWrapper.classList.add('pulse');
        }

        function createFloatingText(amount, x, y) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.textContent = '+' + formatNumber(amount);
            el.style.left = (x - 20) + 'px';
            el.style.top = (y - 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

        // === АВТО-ДОХОД ===
        setInterval(() => {
            if (state.autoIncome > 0) {
                state.balance += state.autoIncome;
                updateUI();
                renderCards();
                throttledSave();
            }
        }, 1000);

        let saveTimeout = null;
        function throttledSave() {
            if (saveTimeout) return;
            saveTimeout = setTimeout(() => {
                saveState();
                saveTimeout = null;
            }, 2000);
        }

        // ==================================================
        // ОФФЛАЙН-ДОХОД
        // ==================================================
        function calculateOffline() {
            if (!state.lastSeen) return null;
            
            const now = Date.now();
            const diffMs = now - state.lastSeen;
            const diffSec = Math.floor(diffMs / 1000);
            
            if (diffSec < 60) return null;
            if (state.autoIncome <= 0) return null;
            
            const maxSec = OFFLINE_MAX_HOURS * 3600;
            const effectiveSec = Math.min(diffSec, maxSec);
            const earned = Math.floor(state.autoIncome * effectiveSec * OFFLINE_RATE);
            
            if (earned <= 0) return null;
            
            return { earned, seconds: diffSec, effectiveSec };
        }

        function showOfflineModal(data) {
            document.getElementById('offline-amount').textContent = '+' + formatNumber(data.earned) + ' 🧊';
            
            let timeText;
            if (data.seconds >= OFFLINE_MAX_HOURS * 3600) {
                timeText = `Отсутствовали ${formatTime(data.seconds)}. Начислено за первые ${OFFLINE_MAX_HOURS} ч (${Math.round(OFFLINE_RATE*100)}%).`;
            } else {
                timeText = `Отсутствовали ${formatTime(data.seconds)}. Начислено ${Math.round(OFFLINE_RATE*100)}% от дохода.`;
            }
            document.getElementById('offline-time').textContent = timeText;
            
            document.getElementById('offline-modal').classList.add('show');
            state.balance += data.earned;
            updateUI();
            renderCards();
            saveState();
        }

        window.closeOfflineModal = function() {
            document.getElementById('offline-modal').classList.remove('show');
        };

        // ==================================================
        // ЛИДЕРБОРД
        // ==================================================
        window.closeLeaderboard = function() {
            document.getElementById('lb-modal').classList.remove('show');
            navRating.classList.remove('active');
        };

        navRating.addEventListener('click', async () => {
            navRating.classList.add('active');
            document.getElementById('lb-modal').classList.add('show');
            await loadLeaderboard();
        });

        async function loadLeaderboard() {
            const lbList = document.getElementById('lb-list');
            lbList.innerHTML = '<div class="modal-text">Загрузка...</div>';
            
            const myId = TG_USER?.id || 'local_' + (localStorage.getItem('lb_uid') || (() => {
                const uid = 'anon_' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem('lb_uid', uid);
                return uid;
            })());
            
            const myName = TG_USER 
                ? `${TG_USER.first_name || ''} ${TG_USER.last_name || ''}`.trim() || 'Игрок' 
                : 'Вы';
            
            try {
                await fetch(LEADERBOARD_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        user_id: myId,
                        name: myName,
                        username: TG_USER?.username || '',
                        photo: TG_USER?.photo_url || '',
                        score: Math.floor(state.balance),
                        initData: tg.initData || ''
                    })
                });
            } catch (e) { console.warn('Score upload failed', e); }
            
            try {
                const res = await fetch(`${LEADERBOARD_API}?limit=100`);
                const data = await res.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    lbList.innerHTML = '<div class="modal-text">Пока никто не играл</div>';
                    return;
                }
                
                lbList.innerHTML = data.map((row, i) => {
                    const rank = i + 1;
                    const rankClass = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
                    const isMe = String(row.user_id) === String(myId) ? 'me' : '';
                    return `
                        <div class="lb-row ${isMe}">
                            <div class="lb-rank ${rankClass}">${rank}</div>
                            <div class="lb-name">${row.name || 'Игрок'}</div>
                            <div class="lb-score">${formatNumber(row.score)}</div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                lbList.innerHTML = '<div class="modal-text">Ошибка загрузки. Проверь соединение.</div>';
                console.warn('Leaderboard load failed', e);
            }
        }

        // ==================================================
        // СБРОС
        // ==================================================
        document.getElementById('reset-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (tg.showConfirm) {
                tg.showConfirm('Сбросить весь прогресс?', () => {
                    localStorage.removeItem(SAVE_KEY);
                    location.reload();
                });
            } else {
                if (confirm('Сбросить весь прогресс?')) {
                    localStorage.removeItem(SAVE_KEY);
                    location.reload();
                }
            }
        });

        // ==================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ==================================================
        loadState();
        recalcIncome();
        
        const offlineData = calculateOffline();
        
        document.querySelectorAll('.main-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.tab === state.activeTab);
        });
        
        updateUI();
        renderCards();
        
        if (offlineData) {
            setTimeout(() => showOfflineModal(offlineData), 400);
        }
        
        window.addEventListener('beforeunload', saveState);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) saveState();
        });
    </script>
</body>
</html>
