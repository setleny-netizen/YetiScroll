<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ice Crystal Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #03060f;
            --bg-mid: #0a1530;
            --accent-green: #00e676;
            --accent-blue: #40c4ff;
            --text-main: #ffffff;
            --text-secondary: #78909c;
            --panel-bg: rgba(10, 21, 48, 0.85);
            
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #03060f;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        /* ============================================
           ФОНОВЫЙ СЛОЙ
           ============================================ */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* Звёзды */
        .stars-bg {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(1px 1px at 20% 30%, #fff, transparent),
                radial-gradient(1px 1px at 60% 70%, #fff, transparent),
                radial-gradient(1px 1px at 80% 20%, #b3e5fc, transparent),
                radial-gradient(1px 1px at 30% 80%, #fff, transparent),
                radial-gradient(1px 1px at 90% 50%, #b3e5fc, transparent),
                radial-gradient(1px 1px at 10% 60%, #fff, transparent),
                radial-gradient(1px 1px at 50% 10%, #fff, transparent),
                radial-gradient(1px 1px at 70% 90%, #b3e5fc, transparent);
            opacity: 0.5;
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        /* Контейнер кристалла — ОПУЩЕН НИЖЕ (было 38%) */
        .crystal-wrapper {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 280px;
            pointer-events: auto;
            cursor: pointer;
            clip-path: polygon(
                50% 0%,
                95% 35%,
                88% 75%,
                50% 100%,
                12% 75%,
                5% 35%
            );
        }

        /* Орбиты с осколками */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            transform: translate(-50%, -50%);
            animation: orbitRotate 12s linear infinite;
            pointer-events: none;
        }

        .orbit.reverse {
            width: 400px;
            height: 400px;
            animation: orbitRotate 18s linear infinite reverse;
        }

        @keyframes orbitRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .shard {
            position: absolute;
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #ffffff, #4fc3f7);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            opacity: 0.8;
        }

        .shard:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
        .shard:nth-child(2) { bottom: 0; left: 50%; transform: translateX(-50%); }
        .shard:nth-child(3) { left: 0; top: 50%; transform: translateY(-50%); }
        .shard:nth-child(4) { right: 0; top: 50%; transform: translateY(-50%); }
        .shard:nth-child(5) { top: 15%; left: 15%; }
        .shard:nth-child(6) { bottom: 15%; right: 15%; }

        /* Кристалл */
        .crystal {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .crystal.clicked {
            animation: crystalClick 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes crystalClick {
            0% { transform: scale(1); }
            40% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .crystal-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            /* УБРАНО: drop-shadow */
        }

        /* ============================================
           ВЕРХНИЙ СЛОЙ: UI
           ============================================ */
        .app-layer {
            position: relative;
            z-index: 10;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            pointer-events: none;
        }

        .score-section,
        .bottom-panel {
            pointer-events: auto;
        }

        #particles-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* --- Score Section --- */
        .score-section {
            text-align: center;
            padding: 15px 0 0 0;
            flex-shrink: 0;
            position: relative;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .balance {
            font-size: 44px;
            font-weight: 900;
            margin: 4px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            transition: transform 0.15s;
            /* УБРАНО: text-shadow */
        }

        .balance.pulse {
            transform: scale(1.1);
        }

        .ice-icon {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* УБРАНО: filter: drop-shadow */
        }

        .ice-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .income-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 14px;
            font-weight: 700;
        }

        .income-per-sec { color: var(--accent-green); }
        .income-per-click { color: var(--accent-blue); }

        .empty-zone {
            flex: 1;
            min-height: 0;
        }

        /* --- Bottom Panel --- */
        .bottom-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 15px;
            padding-bottom: 10px;
            border-top: 1px solid rgba(79, 195, 247, 0.15);
            flex-shrink: 0;
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .tab .tab-icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
        }

        .tab .tab-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .tab.active {
            color: var(--accent-blue);
            position: relative;
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-blue);
            border-radius: 2px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(79, 195, 247, 0.15);
            border-radius: 14px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
            cursor: pointer;
            transition: transform 0.1s, background 0.1s;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.92);
            background: rgba(79, 195, 247, 0.25);
        }

        .card-icon {
            width: 26px;
            height: 26px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .card-label {
            font-size: 9px;
            text-align: center;
            color: #fff;
            line-height: 1.1;
            font-weight: 600;
        }

        .card.orange { background: linear-gradient(135deg, rgba(209, 125, 42, 0.4), rgba(168, 93, 30, 0.6)); }
        .card.green { background: linear-gradient(135deg, rgba(42, 138, 93, 0.4), rgba(30, 92, 65, 0.6)); }
        .card.purple { background: linear-gradient(135deg, rgba(138, 42, 138, 0.4), rgba(92, 30, 92, 0.6)); }
        .card.blue { background: linear-gradient(135deg, rgba(42, 106, 209, 0.4), rgba(30, 76, 138, 0.6)); }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            margin-top: 5px;
            border-top: 1px solid rgba(79, 195, 247, 0.1);
            padding-top: 8px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: var(--text-secondary);
            gap: 2px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- Вспышка --- */
        .flash {
            position: fixed;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(79,195,247,0.5) 30%, transparent 70%);
            pointer-events: none;
            z-index: 50;
            animation: flashOut 0.5s ease-out forwards;
        }

        @keyframes flashOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(3); }
        }

        /* --- Floating text --- */
        .float-text {
            position: fixed;
            color: #ffffff;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 0.9s ease-out forwards;
            z-index: 100;
            font-size: 22px;
            font-variant-numeric: tabular-nums;
            will-change: transform, opacity;
            /* УБРАНО: text-shadow */
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            30% { opacity: 1; transform: translateY(-25px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-80px) scale(1); }
        }

        /* --- Flying shard --- */
        .flying-ice {
            position: fixed;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 200;
            will-change: transform, opacity;
        }

        .flying-ice svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <!-- ФОНОВЫЙ СЛОЙ -->
    <div class="bg-layer">
        <div class="stars-bg"></div>
        
        <div class="crystal-wrapper" id="crystal-wrapper">
            <div class="orbit">
                <div class="shard"></div>
                <div class="shard"></div>
                <div class="shard"></div>
                <div class="shard"></div>
            </div>
            <div class="orbit reverse">
                <div class="shard"></div>
                <div class="shard"></div>
            </div>
            
            <div class="crystal" id="crystal">
                <svg class="crystal-svg" viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="crystalFace1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="30%" stop-color="#e1f5fe"/>
                            <stop offset="70%" stop-color="#81d4fa"/>
                            <stop offset="100%" stop-color="#29b6f6"/>
                        </linearGradient>
                        <linearGradient id="crystalFace2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4fc3f7"/>
                            <stop offset="100%" stop-color="#0288d1"/>
                        </linearGradient>
                        <linearGradient id="crystalFace3" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0288d1"/>
                            <stop offset="100%" stop-color="#01579b"/>
                        </linearGradient>
                        <linearGradient id="crystalFace4" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#b3e5fc"/>
                            <stop offset="100%" stop-color="#4fc3f7"/>
                        </linearGradient>
                        <radialGradient id="crystalShine" cx="30%" cy="20%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                    
                    <polygon points="110,270 50,200 110,170 170,200" fill="url(#crystalFace3)"/>
                    <polygon points="110,270 50,200 80,195 110,220" fill="url(#crystalFace2)" opacity="0.8"/>
                    <polygon points="110,270 170,200 140,195 110,220" fill="url(#crystalFace3)" opacity="0.9"/>
                    
                    <polygon points="50,200 30,100 110,40 110,170" fill="url(#crystalFace4)"/>
                    <polygon points="110,40 110,170 50,200 30,100" fill="url(#crystalFace1)" opacity="0.5"/>
                    <polygon points="110,40 190,100 170,200 110,170" fill="url(#crystalFace2)"/>
                    
                    <polygon points="110,40 190,100 110,120 30,100" fill="url(#crystalFace1)"/>
                    <polygon points="110,40 190,100 110,120" fill="url(#crystalFace2)" opacity="0.6"/>
                    
                    <line x1="110" y1="40" x2="110" y2="170" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
                    <line x1="110" y1="170" x2="110" y2="270" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
                    
                    <polygon points="60,120 100,70 130,90 80,150" fill="url(#crystalShine)" opacity="0.7"/>
                    <polygon points="130,110 155,90 165,105 140,125" fill="#ffffff" opacity="0.4"/>
                    
                    <polygon points="80,100 110,80 130,140 90,170" fill="#ffffff" opacity="0.15"/>
                    <polygon points="130,140 160,120 170,180 140,200" fill="#01579b" opacity="0.2"/>
                    
                    <line x1="110" y1="40" x2="30" y2="100" stroke="#b3e5fc" stroke-width="1" opacity="0.7"/>
                    <line x1="110" y1="40" x2="190" y2="100" stroke="#0288d1" stroke-width="1" opacity="0.7"/>
                    <line x1="30" y1="100" x2="50" y2="200" stroke="#81d4fa" stroke-width="1" opacity="0.6"/>
                    <line x1="190" y1="100" x2="170" y2="200" stroke="#01579b" stroke-width="1" opacity="0.6"/>
                    
                    <ellipse cx="110" cy="120" rx="30" ry="50" fill="#ffffff" opacity="0.15"/>
                </svg>
            </div>
        </div>
    </div>

    <canvas id="particles-canvas"></canvas>

    <!-- ВЕРХНИЙ СЛОЙ: UI -->
    <div class="app-layer">
        
        <div class="score-section">
            <div class="subtitle">ВАШ ЛЁД</div>
            <div class="balance" id="balance-wrapper">
                <span id="balance">0</span>
                <span class="ice-icon">
                    <!-- SVG иконка льда -->
                    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="16,2 28,10 28,22 16,30 4,22 4,10" fill="#4fc3f7" stroke="#b3e5fc" stroke-width="1.5" stroke-linejoin="round"/>
                        <polygon points="16,2 28,10 16,14" fill="#e1f5fe" opacity="0.9"/>
                        <polygon points="16,2 4,10 16,14" fill="#b3e5fc" opacity="0.9"/>
                        <polygon points="16,30 28,22 16,18" fill="#0288d1" opacity="0.7"/>
                        <polygon points="16,30 4,22 16,18" fill="#0277bd" opacity="0.7"/>
                        <polygon points="16,14 16,18 28,22 28,10" fill="#29b6f6" opacity="0.6"/>
                        <polygon points="16,14 16,18 4,22 4,10" fill="#4fc3f7" opacity="0.6"/>
                        <line x1="16" y1="2" x2="16" y2="30" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
                    </svg>
                </span>
            </div>
            <div class="income-info">
                <span id="income-per-sec">+ 0/сек</span>
                <span id="income-per-click" class="income-per-click">+ 0/удар</span>
            </div>
        </div>

        <div class="empty-zone"></div>

        <div class="bottom-panel">
            <div class="tabs">
                <div class="tab active">
                    <span class="tab-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </span>
                    Меню
                </div>
                <div class="tab">
                    <span class="tab-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                        </svg>
                    </span>
                    Улучшения
                </div>
                <div class="tab">
                    <span class="tab-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </span>
                    Бонусы
                </div>
                <div class="tab">
                    <span class="tab-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="9" y1="3" x2="9" y2="21"/>
                        </svg>
                    </span>
                    Инвентарь
                </div>
            </div>

            <div class="cards-grid">
                <div class="card orange" onclick="buyUpgrade(1)">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="#ffd54f" xmlns="http://www.w3.org/2000/svg">
                            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                        </svg>
                    </div>
                    <div class="card-label">Рейтинг</div>
                </div>
                <div class="card green" onclick="buyUpgrade(2)">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#81c784" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="1" x2="12" y2="23"/>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                    </div>
                    <div class="card-label">Перевести</div>
                </div>
                <div class="card purple" onclick="buyUpgrade(3)">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#ce93d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <div class="card-label">История</div>
                </div>
                <div class="card blue" onclick="buyUpgrade(4)">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#64b5f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <path d="M16 10a4 4 0 0 1-8 0"/>
                        </svg>
                    </div>
                    <div class="card-label">Магазин</div>
                </div>
            </div>

            <div class="nav-bar">
                <div class="nav-item active">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="12,2 20,7 20,17 12,22 4,17 4,7"/>
                        </svg>
                    </span>
                    <span>Лёд</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                    </span>
                    <span>Рейтинг</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.5 17.5L3 6V3h3l11.5 11.5"/>
                            <path d="M13 19l6-6"/>
                            <path d="M16 16l4 4"/>
                            <path d="M19 21l2-2"/>
                        </svg>
                    </span>
                    <span>Боссы</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </span>
                    <span>Персонаж</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <span>Профиль</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#03060f');
            tg.setBackgroundColor('#03060f');
        } else {
            tg = {
                close: () => {},
                HapticFeedback: { impactOccurred: () => {}, notificationOccurred: () => {} },
                showAlert: (msg) => alert(msg)
            };
        }

        let balance = 0;
        let incomePerSecond = 0;
        let incomePerClick = 1;
        let upgradeCost = 50;

        const balanceEl = document.getElementById('balance');
        const balanceWrapper = document.getElementById('balance-wrapper');
        const incomeSecEl = document.getElementById('income-per-sec');
        const incomeClickEl = document.getElementById('income-per-click');
        const crystalWrapper = document.getElementById('crystal-wrapper');
        const crystal = document.getElementById('crystal');
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let canvasW = 0, canvasH = 0;
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvasW = window.innerWidth;
            canvasH = window.innerHeight;
            canvas.width = canvasW * dpr;
            canvas.height = canvasH * dpr;
            canvas.style.width = canvasW + 'px';
            canvas.style.height = canvasH + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // === ЧАСТИЦЫ (убраны тени) ===
        const particles = [];
        const MAX_PARTICLES = 120;

        function spawnParticles(x, y, count) {
            for (let i = 0; i < count; i++) {
                if (particles.length >= MAX_PARTICLES) break;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 3;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 3,
                    size: Math.random() * 6 + 3,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.4,
                    life: 1.0,
                    decay: 0.018 + Math.random() * 0.015,
                    color: Math.random() > 0.5 ? '#ffffff' : '#4fc3f7'
                });
            }
        }

        let lastTime = 0;
        function animateParticles(time) {
            const dt = Math.min((time - lastTime) / 16.67, 2);
            lastTime = time;
            ctx.clearRect(0, 0, canvasW, canvasH);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.4 * dt;
                p.vx *= 0.97;
                p.rotation += p.rotSpeed * dt;
                p.life -= p.decay * dt;
                
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                // УБРАНО: ctx.shadowColor и ctx.shadowBlur
                ctx.beginPath();
                ctx.moveTo(0, -p.size);
                ctx.lineTo(p.size * 0.5, 0);
                ctx.lineTo(0, p.size);
                ctx.lineTo(-p.size * 0.5, 0);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);

        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' млрд';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' млн';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + ' тыс.';
            return Math.floor(num).toString();
        }

        function updateUI() {
            balanceEl.textContent = formatNumber(balance);
            incomeSecEl.textContent = `+ ${formatNumber(incomePerSecond)}/сек`;
            incomeClickEl.textContent = `+ ${formatNumber(incomePerClick)}/удар`;
        }

        setInterval(() => {
            if (incomePerSecond > 0) {
                balance += incomePerSecond;
                updateUI();
            }
        }, 1000);

        // === КЛИК ТОЛЬКО ПО КРИСТАЛЛУ ===
        crystalWrapper.addEventListener('click', (e) => {
            e.stopPropagation();
            const x = e.clientX;
            const y = e.clientY;

            balance += incomePerClick;
            updateUI();

            spawnParticles(x, y, 10);
            createFloatingText(incomePerClick, x, y);
            createFlyingShard(x, y);
            createFlash(x, y);
            clickCrystal();
            pulseBalance();
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        function clickCrystal() {
            crystal.classList.remove('clicked');
            void crystal.offsetWidth;
            crystal.classList.add('clicked');
        }

        function pulseBalance() {
            balanceWrapper.classList.remove('pulse');
            void balanceWrapper.offsetWidth;
            balanceWrapper.classList.add('pulse');
        }

        function createFlash(x, y) {
            const flash = document.createElement('div');
            flash.className = 'flash';
            flash.style.left = x + 'px';
            flash.style.top = y + 'px';
            flash.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 500);
        }

        function createFloatingText(amount, x, y) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.textContent = '+' + formatNumber(amount);
            el.style.left = (x - 20) + 'px';
            el.style.top = (y - 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

        // SVG-иконка для летящего осколка
        const ICE_SVG = `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <polygon points="16,2 28,10 28,22 16,30 4,22 4,10" fill="#4fc3f7" stroke="#b3e5fc" stroke-width="1.5" stroke-linejoin="round"/>
            <polygon points="16,2 28,10 16,14" fill="#e1f5fe" opacity="0.9"/>
            <polygon points="16,2 4,10 16,14" fill="#b3e5fc" opacity="0.9"/>
            <polygon points="16,30 28,22 16,18" fill="#0288d1" opacity="0.7"/>
            <polygon points="16,30 4,22 16,18" fill="#0277bd" opacity="0.7"/>
        </svg>`;

        function createFlyingShard(startX, startY) {
            const shard = document.createElement('div');
            shard.className = 'flying-ice';
            shard.innerHTML = ICE_SVG;
            shard.style.left = startX + 'px';
            shard.style.top = startY + 'px';
            document.body.appendChild(shard);
            
            const target = document.querySelector('.ice-icon');
            const targetRect = target.getBoundingClientRect();
            const targetX = targetRect.left + targetRect.width / 2;
            const targetY = targetRect.top + targetRect.height / 2;
            
            const startTime = performance.now();
            const duration = 650;
            const deltaX = targetX - startX;
            const deltaY = targetY - startY;
            const controlX = startX + deltaX * 0.4;
            const controlY = Math.min(startY, targetY) - 120;
            
            function animate(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const mt = 1 - t;
                const x = mt * mt * startX + 2 * mt * t * controlX + t * t * targetX;
                const y = mt * mt * startY + 2 * mt * t * controlY + t * t * targetY;
                const scale = 1 - t * 0.6;
                const opacity = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
                const rotate = t * 360;
                
                shard.style.transform = `translate(${x - startX}px, ${y - startY}px) scale(${scale}) rotate(${rotate}deg)`;
                shard.style.opacity = opacity;
                
                if (t < 1) requestAnimationFrame(animate);
                else shard.remove();
            }
            requestAnimationFrame(animate);
        }

        function buyUpgrade(type) {
            if (balance >= upgradeCost) {
                balance -= upgradeCost;
                upgradeCost = Math.floor(upgradeCost * 1.6);
                
                if (type === 1) incomePerClick += 2;
                if (type === 2) incomePerSecond += 5;
                if (type === 3) incomePerClick += 10;
                if (type === 4) incomePerSecond += 25;
                
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        updateUI();
    </script>
</body>
</html>
